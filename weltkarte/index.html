<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wo wart ihr schon?</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
:root{--ink:#241A0D;--ink-soft:#6B5B3F;--sea-1:#EAF3F4;--sea-2:#D6E7E9;--sea-deep:#C2DADD;--parchment:#F1E4C8;--border:#93794F;--accent-teal:#1E9E8C;--accent-gold:#F2B705;--accent-red:#E23A52;--select:#6D28D9;--accent-ui:#A8730B;--panel-bg:#fff;--font-serif:Georgia,'Iowan Old Style','Palatino Linotype',serif;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overscroll-behavior:none}body{background:var(--sea-1);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}header{flex:0 0 auto;padding:16px 18px 12px;background:linear-gradient(180deg,#FBF6EA,#F3ECDB);border-bottom:1px solid rgba(154,124,74,.3)}h1{margin:0 0 4px;font-family:var(--font-serif);font-weight:600;font-size:21px}.sub{margin:0;font-size:13px;line-height:1.5;color:var(--ink-soft);max-width:65ch}.stats{margin:10px 0 0;font-size:13px;color:var(--accent-ui);font-weight:600}#mapWrap{position:relative;flex:1 1 auto;background:radial-gradient(120% 90% at 50% 20%,var(--sea-1) 0%,var(--sea-2) 55%,var(--sea-deep) 100%);overflow:hidden;touch-action:none}svg{width:100%;height:100%;display:block}path.country{fill:var(--parchment);stroke:var(--border);stroke-width:.65;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}path.country.selected{stroke:var(--select);stroke-width:2}.legend{position:absolute;left:14px;bottom:18px;background:rgba(255,255,255,.92);border:1px solid rgba(147,121,79,.3);border-radius:10px;padding:8px 10px;max-width:160px}.legend-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--parchment),var(--accent-teal),var(--accent-gold),var(--accent-red));margin-bottom:5px}.legend-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft)}.zoomCtrls{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:8px}.zoomBtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(147,121,79,.35);background:rgba(255,255,255,.92);font-size:19px;color:var(--ink)}#panel{position:fixed;left:0;right:0;bottom:0;background:var(--panel-bg);border-top:1px solid rgba(147,121,79,.25);border-radius:18px 18px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:16px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:10}#panel.open{transform:translateY(0)}.panel-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}#panelName{font-family:var(--font-serif);font-size:19px;font-weight:600;margin:0}#panelCount{margin:3px 0 0;font-size:13px;color:var(--ink-soft)}#closePanel{background:none;border:none;font-size:20px;color:var(--ink-soft)}#pinBtn{margin-top:14px;width:100%;padding:13px 16px;border-radius:11px;border:none;font-size:15px;font-weight:600;cursor:pointer}#pinBtn.add{background:var(--accent-red);color:#fff}#pinBtn.remove{background:transparent;color:var(--accent-red);border:1.5px solid var(--accent-red)}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:14px;background:var(--sea-1);z-index:20}.note{margin-top:6px;font-size:11px;color:var(--ink-soft)}
</style>
</head>
<body>
<header><h1>Wo wart ihr schon?</h1><p class="sub">Tippt auf ein Land, in dem ihr schon wart. Eure Auswahl wird auf diesem Gerät gespeichert.</p><p class="stats" id="statsLine">0 Länder markiert</p><div class="note">Zum Verschieben ziehen, zum Zoomen zwei Finger oder + / − nutzen.</div></header>
<div id="mapWrap"><div id="loading">Karte wird geladen …</div><svg id="svg"></svg><div class="legend"><div class="legend-bar"></div><div class="legend-labels"><span>nicht markiert</span><span>markiert</span></div></div><div class="zoomCtrls"><button class="zoomBtn" id="zoomIn">+</button><button class="zoomBtn" id="zoomOut">−</button><button class="zoomBtn" id="zoomReset" style="font-size:14px">⟲</button></div></div>
<div id="panel"><div class="panel-top"><div><p id="panelName">Land</p><p id="panelCount"></p></div><button id="closePanel">×</button></div><button id="pinBtn" class="add">Ich war hier</button></div>
<script>
const GEOJSON='https://cdn.jsdelivr.net/gh/datasets/geo-countries@main/data/countries.geojson';
const svg=d3.select('#svg'), wrap=document.getElementById('mapWrap'), loading=document.getElementById('loading');
const panel=document.getElementById('panel'), panelName=document.getElementById('panelName'), panelCount=document.getElementById('panelCount'), pinBtn=document.getElementById('pinBtn');
let selected=null;let mine=new Set(JSON.parse(localStorage.getItem('visited-countries')||'[]'));let features=[];
function idOf(f){return f.properties['ISO3166-1-Alpha-2']||f.properties.iso_a2||f.properties.ISO_A2||f.properties.name}
function nameOf(f){return f.properties.name||f.properties.ADMIN||'Land'}
function save(){localStorage.setItem('visited-countries',JSON.stringify([...mine]))}
function updateStats(){document.getElementById('statsLine').textContent=`${mine.size} ${mine.size===1?'Land':'Länder'} markiert`}
function refresh(){svg.selectAll('path.country').style('fill',d=>mine.has(idOf(d))?'#E23A52':'#F1E4C8');updateStats()}
function openPanel(f){selected=f;panelName.textContent=nameOf(f);const id=idOf(f);panelCount.textContent=mine.has(id)?'Auf deinem Gerät markiert':'Noch nicht markiert';pinBtn.textContent=mine.has(id)?'Pin entfernen':'Ich war hier';pinBtn.className=mine.has(id)?'remove':'add';panel.classList.add('open');svg.selectAll('path.country').classed('selected',d=>idOf(d)===id)}
pinBtn.onclick=()=>{if(!selected)return;const id=idOf(selected);mine.has(id)?mine.delete(id):mine.add(id);save();refresh();openPanel(selected)};
document.getElementById('closePanel').onclick=()=>{panel.classList.remove('open');svg.selectAll('path.country').classed('selected',false);selected=null};
let zoom=d3.zoom().scaleExtent([1,10]).on('zoom',e=>svg.select('g').attr('transform',e.transform));svg.call(zoom);
document.getElementById('zoomIn').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1.5);document.getElementById('zoomOut').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1/1.5);document.getElementById('zoomReset').onclick=()=>svg.transition().duration(200).call(zoom.transform,d3.zoomIdentity);
async function init(){try{const data=await fetch(GEOJSON).then(r=>{if(!r.ok)throw new Error('map');return r.json()});features=data.features;const rect=wrap.getBoundingClientRect(),w=Math.max(rect.width,320),h=Math.max(rect.height,300);svg.attr('viewBox',`0 0 ${w} ${h}`);const projection=d3.geoNaturalEarth1().fitExtent([[8,8],[w-8,h-8]],data);const path=d3.geoPath(projection);const g=svg.append('g');g.selectAll('path').data(features).join('path').attr('class','country').attr('d',path).on('click',(e,d)=>{e.stopPropagation();openPanel(d)});refresh();loading.style.display='none'}catch(e){loading.textContent='Karte konnte nicht geladen werden. Bitte Internetverbindung prüfen.'}}
init();
</script>
</body></html>
