const { useState, useMemo, useEffect, useRef } = React;

/* ============================================================
   1. HILFSFUNKTIONEN
   ============================================================ */
const fmt = (n, dec = 0) => (!isFinite(n) ? '–'
  : n.toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
const eur = (n, dec = 2) => fmt(n, dec) + ' €';
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Akzeptiert deutsche Eingaben: "1.250", "4,50", "4.5", " 1 250 Stück"
const parseNum = (s) => {
  if (typeof s !== 'string') return NaN;
  let t = s.trim().replace(/\s/g, '').replace(/[^0-9.,\-]/g, '');
  if (t === '' || t === '-') return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const v = parseFloat(t);
  return isNaN(v) ? NaN : v;
};

/* ============================================================
   2. MARKTMODELL   Qd = a − b·P     Qs = c + d·P
   ============================================================ */
const eqPrice = (m) => (m.a - m.c) / (m.b + m.d);
const qd = (m, p) => m.a - m.b * p;
const qs = (m, p) => m.c + m.d * p;
const prohibitiv = (m) => m.a / m.b;          // Höchstzahlungsbereitschaft (Qd = 0)
const minAngebot = (m) => Math.max(0, -m.c / m.d); // Mindestangebotspreis (Qs = 0)

function marktKennzahlen(m) {
  const P = eqPrice(m);
  const Q = qd(m, P);
  const pMaxD = prohibitiv(m);
  const pMinS = minAngebot(m);
  const KR = 0.5 * Q * (pMaxD - P);
  // Bei c > 0 beginnt das Angebot bereits bei P = 0 -> Rente ist ein Trapez statt eines Dreiecks
  const PR = m.c <= 0 ? 0.5 * Q * (P - pMinS) : P * Q - (m.d * P * P) / 2;
  return { P, Q, pMaxD, pMinS, KR, PR, W: KR + PR };
}

/* ============================================================
   3. MÄRKTE / SZENARIEN
   Je Produkt: Zahlenraum für den Marktgenerator, ökonomisch plausible
   Komplementär- und Substitutionsgüter sowie die Reglerdefinitionen.

   kb = Preisabstand vom Gleichgewicht bis zum Prohibitivpreis
   kd = Preisabstand vom Gleichgewicht bis zum Mindestangebotspreis
   Daraus folgen b = Q/kb und d = Q/kd → immer glatte Zahlen.

   k in den Parametern = relative Änderung des Nachfrage-Achsenabschnitts a

const scById = (k) => SCENARIOS.find(s => s.key === k) || SCENARIOS[0];
const pEinheit = (sc) => (sc && sc.pEinheit) || '€';
// Geldbeträge: große Zahlen ohne Nachkommastellen, kleine mit zwei
const geld = (n, sc) => (!isFinite(n) ? '–'
  : fmt(n, Math.abs(n) >= 1000 ? 0 : 2) + ' ' + pEinheit(sc));

function makeMarket(sc) {
  const cand = [];
  for (const P of sc.prices) for (const Q of sc.quantities)
    for (const kb of sc.kb) for (const kd of sc.kd) {
      if (kd >= P) continue;                       // Mindestangebotspreis muss > 0 sein
      const b = Q / kb, d = Q / kd;
      if (!Number.isInteger(b) || !Number.isInteger(d)) continue;
      if (b < 1 || d < 1 || d > 12 * b || b > 12 * d) continue;
      cand.push({ a: Q + b * P, b, c: Q - d * P, d, P, Q, kb, kd, sc });
    }
  return cand.length ? pick(cand) : { a: 1200, b: 100, c: -400, d: 100, P: 8, Q: 400, kb: 4, kd: 4, sc };
}

/* Reglerstellungen → Nachfrageverschiebung.
   Nur der Achsenabschnitt a ändert sich (Parallelverschiebung).
   Der Preis des Gutes selbst verschiebt nichts, er bewegt nur den Punkt AUF der Kurve. */
const startParameter = (sc, m) => {
  const o = { preis: m.P };
  for (const par of sc.parameter) o[par.key] = par.basis;
  return o;
};
function nachfrageFaktor(sc, werte) {
  let f = 1;
  for (const par of sc.parameter) f += par.k * ((werte[par.key] != null ? werte[par.key] : par.basis) - par.basis);
  return clamp(f, 0.4, 1.9);
}
// Untergrenze für a, damit das Gleichgewicht auch bei extremen Reglerkombinationen
// positiv bleibt: Q* = (a·d + b·c)/(b+d) ≥ 8 % der Ausgangsmenge
const aMinimum = (basis) => ((0.08 * basis.Q) * (basis.b + basis.d) - basis.b * basis.c) / basis.d;
const simulierterMarkt = (sc, basis, werte) => ({
  ...basis,
  a: Math.round(clamp(basis.a * nachfrageFaktor(sc, werte), Math.max(1, aMinimum(basis)), basis.a * 1.9)),
});


/* ============================================================

   Jedes Sprite ist ein Zeichenraster mit eigener Farbpalette und wird
   als SVG-Rechtecke gezeichnet (gleiche Farben in einer Zeile werden
   zusammengefasst). Dadurch bleibt alles scharf, skalierbar und
   ohne externe Bilddateien.
   ============================================================ */
/* BILDER-ANFANG */

// Waagrechte Läufe gleicher Farbe zu einem Rechteck zusammenfassen
function spriteRects(name, palÜber, key = '') {
  const sp = SPRITES[name];
  if (!sp) return [];
  const pal = palÜber ? { ...sp.pal, ...palÜber } : sp.pal;
  const out = [];
  sp.r.forEach((zeile, y) => {
    let x = 0;
    while (x < zeile.length) {
      const ch = zeile[x];
      if (ch === '.') { x++; continue; }
      let n = 1;
      while (x + n < zeile.length && zeile[x + n] === ch) n++;
      out.push(<rect key={key + y + '_' + x} x={x} y={y} width={n} height={1} fill={pal[ch] || '#000'} />);
      x += n;
    }
  });
  return out;
}
const spriteMasse = (name) => {
  const sp = SPRITES[name];
  return sp ? { w: sp.r[0].length, h: sp.r.length } : { w: 0, h: 0 };
};

/* Einzelnes Sprite. Liegt unter assets/icons/<name>.png eine Datei, wird sie
   verwendet; sonst wird die Pixelgrafik gezeichnet. */
function Pixel({ name, size = 3, pal, className = '', title }) {
  const { w, h } = spriteMasse(name);
  const bild = BILDER[name];
  if (bild) {
    const kante = Math.round((w || 20) * size);
    return <img src={bild} width={kante} height={kante} alt={title || ''}
                className={`pixelbild ${className}`} draggable="false" />;
  }
  if (!w) return null;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width={w * size} height={h * size} shapeRendering="crispEdges"
         className={className} role={title ? 'img' : 'presentation'} aria-label={title}>
      {spriteRects(name, pal)}
    </svg>
  );
}
/* Sprite innerhalb einer größeren Szene platzieren */
const PixelIn = ({ name, x, y, s = 1, pal, k = '' }) => (
  <g transform={`translate(${x} ${y}) scale(${s})`}>{spriteRects(name, pal, k)}</g>
);

function taskVerschiebung() {
  const sc = pick(SCENARIOS), m = makeMarket(sc);
  const ev = pick(SHIFT_EVENTS);
  const grenze = Math.min(m.kb, m.kd, m.P);
  const moeglich = sc.steps.filter(s => s > 0 && s < grenze);
  const k = moeglich.length ? pick(moeglich) : grenze / 2;
  const delta = k * (m.b + m.d);

  let m2, neuP, neuQ, optIdx, funcText;
  if (ev.curve === 'N') {
    const vz = ev.dir === 'rechts' ? 1 : -1;
    m2 = { ...m, a: m.a + vz * delta };
    neuP = m.P + vz * k; neuQ = m.Q + vz * k * m.d;
    optIdx = ev.dir === 'rechts' ? 0 : 1;
    funcText = `Bei jedem Preis wird die nachgefragte Menge um ${fmt(delta)} ${sc.qUnit} ${ev.dir==='rechts'?'größer':'kleiner'}. Die neue Nachfragefunktion lautet:  Qd′ = ${fmt(m2.a)} − ${fmt(m.b)}·P`;
  } else {
    const vz = ev.dir === 'rechts' ? 1 : -1;
    m2 = { ...m, c: m.c + vz * delta };
    neuP = m.P - vz * k; neuQ = m.Q + vz * k * m.b;
    optIdx = ev.dir === 'rechts' ? 2 : 3;
    funcText = `Bei jedem Preis wird die angebotene Menge um ${fmt(delta)} ${sc.qUnit} ${ev.dir==='rechts'?'größer':'kleiner'}. Die neue Angebotsfunktion lautet:  Qs′ = ${m2.c<0?'−'+fmt(-m2.c):fmt(m2.c)} + ${fmt(m.d)}·P`;
  }
  const nA = ev.curve === 'N' ? m2.a : m.a, nC = ev.curve === 'N' ? m.c : m2.c;

  return {
    stufe:3, sc, m, m2, titel:'Marktveränderung analysieren',
    aufgabe:[
      'Ausgangslage – gegeben sind die Funktionen:',
      'FUNKTIONEN',
      `Gleichgewicht: P* = ${eur(m.P)}, Q* = ${fmt(m.Q)} ${sc.qUnit}.`,
      `Ereignis: ${ev.t(sc)}`,
      funcText,
      'Beurteile zuerst, welche Kurve sich in welche Richtung verschiebt, und berechne dann das neue Marktgleichgewicht.',
    ],
    choices:[{ key:'shift', frage:'Was passiert im Diagramm (ceteris paribus)?', options:SHIFT_OPTIONS, correct:optIdx }],
    fields:[
      { key:'p', label:'Neuer Gleichgewichtspreis P*′', unit:'€', correct:neuP, tol:TOL_P, dec:2 },
      { key:'q', label:'Neue Gleichgewichtsmenge Q*′', unit:sc.qUnit, correct:neuQ, tol:TOL_Q, dec:0 },
    ],
    tipp:'Nur eine Kurve verschiebt sich – die andere Funktion bleibt unverändert. Setze die neue Funktion mit der unveränderten gleich (Qd′ = Qs bzw. Qd = Qs′).',
    loesung:[
      ev.why,
      `Neuer Ansatz: ${fmt(nA)} − ${fmt(m.b)}·P = ${nC<0?'−'+fmt(-nC):fmt(nC)} + ${fmt(m.d)}·P`,
      `${fmt(nA - nC)} = ${fmt(m.b + m.d)}·P   →   P*′ = ${eur(neuP)}`,
      `Q*′ = ${fmt(nA)} − ${fmt(m.b)} · ${fmt(neuP,2)} = ${fmt(neuQ)} ${sc.qUnit}`,
      `Veränderung: Preis ${neuP>m.P?'steigt':'sinkt'} um ${eur(Math.abs(neuP-m.P))}, Menge ${neuQ>m.Q?'steigt':'sinkt'} um ${fmt(Math.abs(neuQ-m.Q))} ${sc.qUnit}.`,
    ],
    chart:{ showSurplus:false, showEq:true, revealCompare:true },
    reward:25,
  };
}

  const sc = pick(SCENARIOS), m = makeMarket(sc);
  const typ = Math.random() < 0.5 ? 'hoechst' : 'mindest';
  const grenze = typ === 'hoechst' ? m.kd : m.kb;
  const moeglich = sc.steps.filter(s => s > 0 && s < grenze);
  const k = moeglich.length ? pick(moeglich) : grenze / 2;
  const Pfix = typ === 'hoechst' ? m.P - k : m.P + k;
  const nachfrage = qd(m, Pfix), angebot = qs(m, Pfix);
  const ueber = Math.abs(nachfrage - angebot);
  const istHoechst = typ === 'hoechst';

  return {
    stufe:4, sc, m, titel: istHoechst ? 'Höchstpreis analysieren' : 'Mindestpreis analysieren',
    aufgabe:[
      'Gegeben sind die Funktionen:',
      'FUNKTIONEN',
      `Das freie Marktgleichgewicht liegt bei P* = ${eur(m.P)} und Q* = ${fmt(m.Q)} ${sc.qUnit}.`,
      istHoechst
        ? `Der Staat legt zum Schutz der Verbraucher einen Höchstpreis von ${eur(Pfix)} fest.`
        : `Der Staat legt zum Schutz der Anbieter einen Mindestpreis von ${eur(Pfix)} fest.`,
      `Berechne die nachgefragte und die angebotene Menge zu diesem Preis sowie den entstehenden Überschuss.`,
    ],
    choices:[{ key:'zustand', frage:'Welcher Marktzustand entsteht?', options:[
      'Nachfrageüberschuss (Angebotslücke / Mangel)',
      'Angebotsüberschuss (Überproduktion)',
      'Der Markt bleibt im Gleichgewicht.',
    ], correct: istHoechst ? 0 : 1 }],
    fields:[
      { key:'qn', label:`Nachfragemenge bei ${eur(Pfix)}`, unit:sc.qUnit, correct:nachfrage, tol:TOL_Q, dec:0 },
      { key:'qa', label:`Angebotsmenge bei ${eur(Pfix)}`, unit:sc.qUnit, correct:angebot, tol:TOL_Q, dec:0 },
      { key:'ue', label: istHoechst ? 'Nachfrageüberschuss' : 'Angebotsüberschuss', unit:sc.qUnit, correct:ueber, tol:TOL_Q, dec:0 },
    ],
    tipp: istHoechst
      ? 'Ein wirksamer Höchstpreis liegt UNTER dem Gleichgewichtspreis. Setze den Preis in beide Funktionen ein – die Nachfrage ist dann größer als das Angebot.'
      : 'Ein wirksamer Mindestpreis liegt ÜBER dem Gleichgewichtspreis. Setze den Preis in beide Funktionen ein – das Angebot ist dann größer als die Nachfrage.',
    loesung:[
      `Qd(${fmt(Pfix,2)}) = ${fmt(m.a)} − ${fmt(m.b)} · ${fmt(Pfix,2)} = ${fmt(nachfrage)} ${sc.qUnit}`,
      `Qs(${fmt(Pfix,2)}) = ${m.c<0?'−'+fmt(-m.c):fmt(m.c)} + ${fmt(m.d)} · ${fmt(Pfix,2)} = ${fmt(angebot)} ${sc.qUnit}`,
      istHoechst
        ? `Nachfrageüberschuss = Qd − Qs = ${fmt(nachfrage)} − ${fmt(angebot)} = ${fmt(ueber)} ${sc.qUnit}`
        : `Angebotsüberschuss = Qs − Qd = ${fmt(angebot)} − ${fmt(nachfrage)} = ${fmt(ueber)} ${sc.qUnit}`,
      istHoechst
        ? `Gehandelt wird nur die kleinere Menge (${fmt(angebot)} ${sc.qUnit}). Es entsteht ein Mangel; typische Folgen sind Wartelisten, Rationierung oder Schwarzmärkte.`
        : `Gehandelt wird nur die kleinere Menge (${fmt(nachfrage)} ${sc.qUnit}). Es entsteht ein Überschuss, der z. B. eingelagert oder vom Staat aufgekauft werden muss.`,
    ],
    chart:{ showSurplus:false, showEq:true, priceLine:Pfix, gapLabel:true },
    reward:25,
  };
}

/* --- Stufe 5: Preiselastizität der Nachfrage ---------------- */
function taskElastizitaet() {
  const sc = pick(SCENARIOS), m = makeMarket(sc);
  // Nur Preispaare zulassen, bei denen beide Mengen deutlich positiv bleiben
  const kombis = [];
  for (const p1 of [m.P, m.P - Math.min(...sc.steps), m.P + Math.min(...sc.steps)])
    for (const k of sc.steps)
      if (p1 > 0 && qd(m, p1) > 0.25 * m.Q && qd(m, p1 + k) > 0.2 * m.Q)
        kombis.push([p1, k]);
  const [P1, k] = kombis.length ? pick(kombis) : [m.P, m.kb / 4];
  const P2 = P1 + k;
  const Q1 = qd(m, P1), Q2 = qd(m, P2);
  const eps = ((Q2 - Q1) / Q1) / ((P2 - P1) / P1);
  const abs = Math.abs(eps);
  const interp = abs > 1.0001 ? 0 : abs < 0.9999 ? 1 : 2;
  const U1 = P1 * Q1, U2 = P2 * Q2;
  const umsatz = U2 > U1 + 0.01 ? 0 : U2 < U1 - 0.01 ? 1 : 2;

  return {
    stufe:5, sc, m, titel:'Preiselastizität der Nachfrage',
    aufgabe:[
      'Gegeben sind die Funktionen:',
      'FUNKTIONEN',
      `Der Preis steigt von P₁ = ${eur(P1)} auf P₂ = ${eur(P2)}.`,
      'Berechne die zugehörigen Nachfragemengen und die Preiselastizität der Nachfrage (Ausgangswert-Methode, auf 2 Dezimalstellen).',
    ],
    choices:[
      { key:'interp', frage:'Wie ist die Nachfrage in diesem Preisbereich zu beurteilen?', options:[
        'elastisch  (|ε| > 1) – die Menge reagiert überproportional',
        'unelastisch  (|ε| < 1) – die Menge reagiert unterproportional',
        'isoelastisch / einheitselastisch  (|ε| = 1)',
      ], correct:interp },
      { key:'umsatz', frage:'Wie verändert sich der Umsatz der Anbieter (P · Q)?', options:[
        'Der Umsatz steigt.', 'Der Umsatz sinkt.', 'Der Umsatz bleibt unverändert.',
      ], correct:umsatz },
    ],
    fields:[
      { key:'q1', label:'Nachfragemenge Q₁', unit:sc.qUnit, correct:Q1, tol:TOL_Q, dec:0 },
      { key:'q2', label:'Nachfragemenge Q₂', unit:sc.qUnit, correct:Q2, tol:TOL_Q, dec:0 },
      { key:'e',  label:'Preiselastizität ε (mit Vorzeichen)', unit:'', correct:eps, tol:0.03, dec:2 },
    ],
    tipp:'ε = (relative Mengenänderung) : (relative Preisänderung) = (ΔQ : Q₁) : (ΔP : P₁). Das Ergebnis ist bei normaler Nachfrage negativ. Für die Beurteilung zählt der Betrag |ε|.',
    loesung:[
      `Q₁ = ${fmt(m.a)} − ${fmt(m.b)} · ${fmt(P1,2)} = ${fmt(Q1)} ${sc.qUnit}`,
      `Q₂ = ${fmt(m.a)} − ${fmt(m.b)} · ${fmt(P2,2)} = ${fmt(Q2)} ${sc.qUnit}`,
      `ΔQ = ${fmt(Q2-Q1)} ${sc.qUnit};  ΔP = ${eur(P2-P1)}`,
      `relative Mengenänderung = ${fmt(Q2-Q1)} : ${fmt(Q1)} = ${fmt((Q2-Q1)/Q1, 4)}`,
      `relative Preisänderung  = ${fmt(P2-P1,2)} : ${fmt(P1,2)} = ${fmt((P2-P1)/P1, 4)}`,
      `ε = ${fmt((Q2-Q1)/Q1,4)} : ${fmt((P2-P1)/P1,4)} = ${fmt(eps,2)}`,
      `|ε| = ${fmt(abs,2)} → Nachfrage ist ${['elastisch','unelastisch','isoelastisch'][interp]}.`,
      `Umsatz vorher: ${eur(U1)} · Umsatz nachher: ${eur(U2)} → Der Umsatz ${['steigt','sinkt','bleibt gleich'][umsatz]}.`,
    ],
    chart:{ showSurplus:false, showEq:false, points:[
      { p:P1, q:Q1, label:'P₁', color:'#7C3AED' },
      { p:P2, q:Q2, label:'P₂', color:'#DB2777' },
    ] },
    reward:30,
  };
}

const GENERATOREN = { 1:taskGleichgewicht, 2:taskRenten, 3:taskVerschiebung, 4:taskEingriff, 5:taskElastizitaet };
function makeTask(stufe) {
  const s = stufe === 0 ? pick([1,2,3,4,5]) : stufe;
  return GENERATOREN[s]();
}
function makeRunde(stufe, anzahl = 5) {
  return Array.from({ length: anzahl }, () => makeTask(stufe));
}

/* ============================================================
   5. DIAGRAMM (SVG, reagiert auf jede Änderung)
   ============================================================ */
function niceScale(max, teile = 5) {
  if (!isFinite(max) || max <= 0) return { step: 1, max: 5 };
  const raw = max / teile;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return { step, max: Math.ceil(max / step) * step };
}

// Breite des eigenen Containers messen – maßgeblich ist die Diagrammbreite,
// nicht die Fensterbreite
function useBreite() {
  const ref = useRef(null);
  const [breite, setBreite] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    setBreite(el.getBoundingClientRect().width);
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(e => setBreite(e[0].contentRect.width));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return [ref, breite];
}

function useKompakt() {
  const [k, setK] = useState(() => typeof window !== 'undefined' && window.innerWidth < 1280);
  useEffect(() => {
    const h = () => setK(window.innerWidth < 1280);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return k;
}

function MarktChart({ m, compare, priceLine, showSurplus, showEq = true, points, gapLabel, sc, titel,
                      kompakt, linien, rechteck, mini, verschiebung }) {
  const [wrapRef, breite] = useBreite();
  // Schmale Container bekommen einen kleineren Zeichenbereich, damit Schrift
  // und Punkte im Verhältnis größer und damit lesbar bleiben.
  const schmal = mini ? false : (breite > 0 ? breite < 520 : !!kompakt);
  const W = mini ? 300 : (schmal ? 440 : 640);
  const H = mini ? 205 : (schmal ? 350 : 430);
  const pad = mini ? { l: 46, r: 18, t: 12, b: 28 }
    : schmal ? { l: 54, r: 28, t: 26, b: 48 } : { l: 68, r: 34, t: 30, b: 58 };
  const FS = mini ? 11 : (schmal ? 14 : 12), FSL = mini ? 12 : (schmal ? 15 : 13);
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const ms = [m, compare].filter(Boolean);

  const teile = mini ? 2 : (schmal ? 4 : 5);
  const pS = niceScale(Math.max(...ms.map(x => prohibitiv(x))) * 1.06, teile);
  const qS = niceScale(Math.max(...ms.map(x => x.a)) * 1.06, teile);
  const pMax = pS.max, qMax = qS.max;
  const X = (q) => pad.l + clamp(q / qMax, 0, 1.2) * iw;
  const Y = (p) => pad.t + ih - clamp(p / pMax, 0, 1.2) * ih;

  const k = marktKennzahlen(m);
  const pDec = pMax <= 20 ? 0 : 0;

  const curves = (mk, solid) => {
    const dTop = prohibitiv(mk), dStart = { q: 0, p: dTop }, dEnd = { q: mk.a, p: 0 };
    const sLowP = minAngebot(mk), sLowQ = Math.max(0, mk.c);
    const pEnd = Math.min(pMax, (qMax - mk.c) / mk.d);
    const sEnd = { q: mk.c + mk.d * pEnd, p: pEnd };
    return { dStart, dEnd, sStart: { q: sLowQ, p: sLowP }, sEnd, solid };
  };
  const main = curves(m, true);
  const old = compare ? curves(compare, false) : null;

  const dotsOn = (A, B, n = 7) => Array.from({ length: n }, (_, i) => {
    const t = i / (n - 1);
    return { x: X(A.q + (B.q - A.q) * t), y: Y(A.p + (B.p - A.p) * t) };
  });

  const pTicks = [], qTicks = [];
  for (let v = 0; v <= pMax + 1e-9; v += pS.step) pTicks.push(v);
  for (let v = 0; v <= qMax + 1e-9; v += qS.step) qTicks.push(v);

  const plQd = priceLine != null ? qd(m, priceLine) : null;
  const plQs = priceLine != null ? qs(m, priceLine) : null;

  return (
    <div className="w-full" ref={wrapRef}>
      {titel && <div className="text-center pixel text-[13px] sm:text-sm font-bold text-slate-700 mb-1">{titel}</div>}
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto block" role="img" aria-label="Angebots- und Nachfragediagramm">
        {/* Gitternetz */}
        {pTicks.map((v, i) => <line key={'gp'+i} x1={pad.l} x2={pad.l+iw} y1={Y(v)} y2={Y(v)} stroke="#F1EDE1" strokeWidth="1" />)}
        {qTicks.map((v, i) => <line key={'gq'+i} x1={X(v)} x2={X(v)} y1={pad.t} y2={pad.t+ih} stroke="#F1EDE1" strokeWidth="1" />)}

        {/* Renten-Flächen */}
        {showSurplus && (
          <g className="drawin">
            <polygon points={`${X(0)},${Y(k.P)} ${X(0)},${Y(k.pMaxD)} ${X(k.Q)},${Y(k.P)}`} fill="#86EFAC" fillOpacity="0.55" />
            {m.c <= 0
              ? <polygon points={`${X(0)},${Y(k.P)} ${X(0)},${Y(k.pMinS)} ${X(k.Q)},${Y(k.P)}`} fill="#FCA5A5" fillOpacity="0.55" />
              : <polygon points={`${X(0)},${Y(k.P)} ${X(0)},${Y(0)} ${X(m.c)},${Y(0)} ${X(k.Q)},${Y(k.P)}`} fill="#FCA5A5" fillOpacity="0.55" />}
          </g>
        )}

        {/* Ausgangskurven (gestrichelt) bei Verschiebungen */}
        {old && (
          <g className="drawin">
            <line x1={X(old.dStart.q)} y1={Y(old.dStart.p)} x2={X(old.dEnd.q)} y2={Y(old.dEnd.p)}
                  stroke="#93C5FD" strokeWidth="2.5" strokeDasharray="7 5" />
            <line x1={X(old.sStart.q)} y1={Y(old.sStart.p)} x2={X(old.sEnd.q)} y2={Y(old.sEnd.p)}
                  stroke="#FCA5A5" strokeWidth="2.5" strokeDasharray="7 5" />
            {(() => { const ko = marktKennzahlen(compare); return (
              <circle cx={X(ko.Q)} cy={Y(ko.P)} r="6" fill="#fff" stroke="#9CA3AF" strokeWidth="2.5" />
            ); })()}
          </g>
        )}

        {/* Pfeil, der die Verschiebung der Nachfragekurve zeigt */}
        {verschiebung && compare && !mini && (() => {
          const pRef = pMax * 0.62;
          const qAlt = qd(compare, pRef), qNeu = qd(m, pRef);
          if (Math.abs(qNeu - qAlt) < qMax * 0.02 || qAlt < 0 || qNeu < 0) return null;
          const rechts = qNeu > qAlt, y = Y(pRef);
          return (
            <g className="drawin">
              <line x1={X(qAlt)} y1={y} x2={X(qNeu)} y2={y} stroke="#1D4ED8" strokeWidth="2.5" />
              <polygon points={`${X(qNeu)},${y} ${X(qNeu) + (rechts ? -9 : 9)},${y - 5} ${X(qNeu) + (rechts ? -9 : 9)},${y + 5}`} fill="#1D4ED8" />
              <text x={(X(qAlt) + X(qNeu)) / 2} y={y - 9} fontSize={FSL} fontWeight="700"
                    textAnchor="middle" fill="#1D4ED8">Nachfrage {rechts ? 'steigt' : 'sinkt'}</text>
            </g>
          );
        })()}

        {/* Höchst-/Mindestpreis-Linie */}
        {priceLine != null && (
          <g>
            <line x1={pad.l} x2={pad.l+iw} y1={Y(priceLine)} y2={Y(priceLine)} stroke="#7C3AED" strokeWidth="2.5" strokeDasharray="8 4" />
            <text x={pad.l+4} y={Y(priceLine)-7} fontSize={FSL} fontWeight="700" fill="#7C3AED">P = {fmt(priceLine,2)} €</text>
            <line x1={X(Math.min(plQd,plQs))} x2={X(Math.max(plQd,plQs))} y1={Y(priceLine)} y2={Y(priceLine)}
                  stroke="#7C3AED" strokeWidth="7" strokeOpacity="0.28" strokeLinecap="round" />
            <circle cx={X(plQd)} cy={Y(priceLine)} r="5.5" fill="#2563EB" stroke="#fff" strokeWidth="2" />
            <circle cx={X(plQs)} cy={Y(priceLine)} r="5.5" fill="#EF4444" stroke="#fff" strokeWidth="2" />
            {gapLabel && Math.abs(plQd - plQs) > 0.001 && (
              <text x={X((plQd+plQs)/2)} y={Y(priceLine)+20} fontSize={FSL} fontWeight="700" textAnchor="middle" fill="#6D28D9">
                {plQd > plQs ? 'Mangel' : 'Überschuss'}: {fmt(Math.abs(plQd-plQs))}
              </text>
            )}
          </g>
        )}

        {/* Angebot & Nachfrage */}
        <line x1={X(main.dStart.q)} y1={Y(main.dStart.p)} x2={X(main.dEnd.q)} y2={Y(main.dEnd.p)} stroke="#2563EB" strokeWidth="3.5" strokeLinecap="round" />
        <line x1={X(main.sStart.q)} y1={Y(main.sStart.p)} x2={X(main.sEnd.q)} y2={Y(main.sEnd.p)} stroke="#EF4444" strokeWidth="3.5" strokeLinecap="round" />
        {dotsOn(main.dStart, main.dEnd).map((p, i) => <circle key={'dd'+i} cx={p.x} cy={p.y} r="3.6" fill="#2563EB" />)}
        {dotsOn(main.sStart, main.sEnd).map((p, i) => <circle key={'sd'+i} cx={p.x} cy={p.y} r="3.6" fill="#EF4444" />)}

        {/* Gleichgewicht */}
        {showEq && k.P > 0 && k.Q > 0 && (
          <g className="pop">
            <line x1={X(k.Q)} y1={Y(k.P)} x2={X(k.Q)} y2={Y(0)} stroke="#64748B" strokeWidth="1.6" strokeDasharray="5 4" />
            <line x1={X(k.Q)} y1={Y(k.P)} x2={X(0)} y2={Y(k.P)} stroke="#64748B" strokeWidth="1.6" strokeDasharray="5 4" />
            <circle cx={X(k.Q)} cy={Y(k.P)} r="8" fill="#FACC15" stroke="#78350F" strokeWidth="2" />
          </g>
        )}

        {/* Gewinnrechteck (Spielmodus) */}
        {rechteck && rechteck.q > 0 && (
          <g className="drawin">
            <rect x={X(0)} y={Y(Math.max(rechteck.pVon, rechteck.pBis))}
                  width={Math.max(0, X(rechteck.q) - X(0))}
                  height={Math.max(0, Y(Math.min(rechteck.pVon, rechteck.pBis)) - Y(Math.max(rechteck.pVon, rechteck.pBis)))}
                  fill={rechteck.farbe || '#22C55E'} fillOpacity="0.28"
                  stroke={rechteck.farbe || '#22C55E'} strokeWidth="1.5" strokeDasharray="4 3" />
            {rechteck.label && (() => {
              const mittig = X(rechteck.q) - X(0) > iw * 0.3;
              return (
                <text x={mittig ? X(rechteck.q / 2) : X(rechteck.q) + 8}
                      y={Y((rechteck.pVon + rechteck.pBis) / 2) + 4}
                      fontSize={FSL} fontWeight="800" textAnchor={mittig ? 'middle' : 'start'}
                      fill="#15803D">{rechteck.label}</text>
              );
            })()}
          </g>
        )}

        {/* waagrechte Bezugslinien (eigener Preis, Konkurrenzpreis) */}
        {(linien || []).map((l, i) => (
          <g key={'ln'+i}>
            <line x1={pad.l} x2={pad.l+iw} y1={Y(l.p)} y2={Y(l.p)} stroke={l.farbe} strokeWidth="2.5"
                  strokeDasharray={l.gestrichelt ? '8 4' : undefined} />
            <text x={pad.l + iw - 2 - iw * 0.30 * (i % 3)} y={Y(l.p) - 6}
                  fontSize={FSL} fontWeight="700" textAnchor="end" fill={l.farbe}>{l.label}</text>
          </g>
        ))}

        {/* zusätzliche Punkte (z. B. Elastizität) */}
        {(points || []).map((pt, i) => (
          <g key={'pt'+i}>
            <line x1={X(pt.q)} y1={Y(pt.p)} x2={X(pt.q)} y2={Y(0)} stroke={pt.color} strokeWidth="1.4" strokeDasharray="4 4" />
            <line x1={X(pt.q)} y1={Y(pt.p)} x2={X(0)} y2={Y(pt.p)} stroke={pt.color} strokeWidth="1.4" strokeDasharray="4 4" />
            <circle cx={X(pt.q)} cy={Y(pt.p)} r="7" fill={pt.color} stroke="#fff" strokeWidth="2" />
            <text x={X(pt.q)+11} y={Y(pt.p) + (pt.unten ? 18 : -9)} fontSize={FSL} fontWeight="800" fill={pt.color}>{pt.label}</text>
          </g>
        ))}

        {/* Achsen */}
        <line x1={pad.l} y1={pad.t-6} x2={pad.l} y2={pad.t+ih} stroke="#334155" strokeWidth="2" />
        <line x1={pad.l} y1={pad.t+ih} x2={pad.l+iw+8} y2={pad.t+ih} stroke="#334155" strokeWidth="2" />
        {pTicks.map((v, i) => (
          <text key={'tp'+i} x={pad.l-9} y={Y(v)+4} fontSize={FS} textAnchor="end" fill="#475569">{fmt(v, pDec)}</text>
        ))}
        {qTicks.map((v, i) => (
          <text key={'tq'+i} x={X(v)} y={pad.t+ih+19} fontSize={FS} textAnchor="middle" fill="#475569">{fmt(v)}</text>
        ))}
        {!mini && <>
          <text x={pad.l-(schmal?46:52)} y={pad.t-12} fontSize={FSL} fontWeight="700" fill="#334155">
            Preis ({pEinheit(sc)})
          </text>
          <text x={pad.l+iw+8} y={pad.t+ih+(schmal?36:40)} fontSize={FSL} fontWeight="700" textAnchor="end" fill="#334155">
            Menge ({sc ? sc.qUnit : 'Stück'})
          </text>
        </>}
      </svg>

      <div className={`${mini ? 'hidden' : 'flex'} flex-wrap items-center justify-center gap-x-4 gap-y-1 mt-1 text-[11px] sm:text-xs text-slate-600`}>
        <span className="flex items-center gap-1.5"><span className="inline-block w-4 h-0.5 bg-red-500"></span>Angebot</span>
        <span className="flex items-center gap-1.5"><span className="inline-block w-4 h-0.5 bg-blue-600"></span>Nachfrage</span>
        {showEq && <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-full bg-yellow-400 border border-amber-800"></span>Gleichgewicht</span>}
        {showSurplus && <>
          <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded bg-green-300"></span>Konsumentenrente</span>
          <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded bg-red-300"></span>Produzentenrente</span>
        </>}
        {compare && <span className="flex items-center gap-1.5"><span className="inline-block w-4 border-t-2 border-dashed border-slate-400"></span>vorher</span>}
      </div>
    </div>
  );
}


/* ============================================================
   5b. PIXEL-MARKTWELT
   Die Szene ist keine Dekoration: Zahl der Kundschaft folgt der
   nachgefragten Menge, Warenkisten und Lieferwagen folgen der
   angebotenen Menge – jeweils beim aktuell eingestellten Preis.
   ============================================================ */
const PERSONEN_FARBEN = [
  { c:'#2563EB', h:'#3F2A14' }, { c:'#DC2626', h:'#1F2937' }, { c:'#16A34A', h:'#7C2D12' },
  { c:'#7C3AED', h:'#451A03' }, { c:'#0891B2', h:'#3F2A14' }, { c:'#D97706', h:'#1F2937' },
  { c:'#DB2777', h:'#78350F' },
];
const HAUS_FARBEN = [{ d:'#B45309' }, { d:'#7C2D12' }, { d:'#334155' }, { d:'#9A3412' }];

function Marktwelt({ sc, basis, markt, preis }) {
  const nachfrage = Math.max(0, qd(markt, preis));
  const angebot = Math.max(0, qs(markt, preis));
  const bezug = basis.Q || 1;
  const personen = clamp(Math.round((nachfrage / bezug) * 8), 1, 14);
  const kisten = clamp(Math.round((angebot / bezug) * 6), 0, 12);
  const lieferung = kisten >= 8;
  const k = marktKennzahlen(markt);
  const differenz = angebot - nachfrage;

  const lage = Math.abs(differenz) < bezug * 0.03
    ? { t:'Markt geräumt – Angebot und Nachfrage passen zusammen.', f:'text-green-700', i:'⚖️' }
    : differenz > 0
      ? { t:`Angebotsüberschuss: ${fmt(differenz)} ${sc.qUnit} bleiben liegen.`, f:'text-red-600', i:'📦' }
      : { t:`Nachfrageüberschuss: ${fmt(-differenz)} ${sc.qUnit} gehen leer aus.`, f:'text-purple-700', i:'🙋' };

  return (
    <div className="relative">
      <div className="rounded-xl overflow-hidden border border-[#DBE7F3]">
        <svg viewBox="0 0 340 130" className="w-full h-auto block" shapeRendering="crispEdges"
             role="img" aria-label={`Marktwelt: ${personen} Kundinnen und Kunden, ${kisten} Warenkisten`}>
          <defs>
            <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#CFEAFB" /><stop offset="100%" stopColor="#EAF6FF" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="340" height="88" fill="url(#himmel)" />
          <rect x="0" y="86" width="340" height="44" fill="#8FCB6B" />
          <rect x="0" y="96" width="340" height="34" fill="#C9B896" />
          <rect x="0" y="96" width="340" height="2" fill="#B3A184" />

          <PixelIn name="wolke" x={24} y={10} s={1.6} k="w1" />
          <PixelIn name="wolke" x={232} y={6} s={2} k="w2" />
          <PixelIn name="wolke" x={148} y={20} s={1.2} k="w3" />

          {/* Hintergrundbebauung */}
          <PixelIn name="haus" x={2}   y={52} s={2.1} pal={HAUS_FARBEN[0]} k="h1" />
          <PixelIn name="haus" x={34}  y={58} s={1.7} pal={HAUS_FARBEN[1]} k="h2" />
          <PixelIn name="haus" x={288} y={54} s={2}   pal={HAUS_FARBEN[2]} k="h3" />
          <PixelIn name="haus" x={316} y={60} s={1.6} pal={HAUS_FARBEN[3]} k="h4" />
          <PixelIn name="baum" x={70}  y={62} s={1.7} k="b1" />
          <PixelIn name="baum" x={98}  y={68} s={1.3} k="b2" />

          {/* Marktstand */}
          <PixelIn name="stand" x={118} y={50} s={2.4} k="st" />

          {/* Warenvorrat – wächst mit der angebotenen Menge */}
          {Array.from({ length: kisten }).map((_, i) => {
            const reihe = Math.floor(i / 4), spalte = i % 4;
            return <PixelIn key={'k' + i} name="kiste" k={'k' + i}
                     x={186 + spalte * 15 - reihe * 4} y={82 - reihe * 13} s={1.7} />;
          })}
          {lieferung && <PixelIn name="lkw" x={248} y={64} s={1.4} k="lkw" />}

          {/* Kundschaft – wächst mit der nachgefragten Menge */}
          {Array.from({ length: personen }).map((_, i) => {
            const farbe = PERSONEN_FARBEN[i % PERSONEN_FARBEN.length];
            const x = 12 + ((i * 47) % 300);
            const y = 96 + ((i * 31) % 10);
            return <PixelIn key={'p' + i} name="person" k={'p' + i} x={x} y={y} s={1.5} pal={farbe} />;
          })}
        </svg>
      </div>

      {/* Info-Tafeln */}
      <div className="hidden sm:block absolute left-2 top-2 rounded-lg bg-slate-800/85 text-white px-2.5 py-1.5 text-[10.5px] leading-tight shadow">
        <div className="font-bold text-[10px] tracking-wider text-emerald-300">HERSTELLER</div>
        <div>Angebot ab: <b>{geld(k.pMinS, sc)}</b></div>
        <div>Angebotene Menge: <b>{fmt(angebot)}</b></div>
      </div>
      <div className="hidden sm:block absolute right-2 top-2 rounded-lg bg-slate-800/85 text-white px-2.5 py-1.5 text-[10.5px] leading-tight shadow text-right">
        <div className="font-bold text-[10px] tracking-wider text-sky-300">KONSUMENTEN</div>
        <div>Ø max. Preis: <b>{geld(k.pMaxD, sc)}</b></div>
        <div>Käufer heute: <b>{fmt(nachfrage)}</b></div>
      </div>

      <div className={`mt-2 text-[12.5px] font-semibold ${lage.f}`}>{lage.i} {lage.t}</div>
      <div className="text-[11.5px] text-slate-500 leading-snug">
        {personen} Kundinnen und Kunden am Markt · {kisten} Warenkisten{lieferung ? ' · zusätzliche Lieferung unterwegs' : ''}
      </div>
      <div className="sm:hidden mt-1 grid grid-cols-2 gap-1.5 text-[11px]">
        <div className="rounded-lg bg-slate-100 px-2 py-1 leading-tight">
          <span className="font-bold text-emerald-700">Hersteller</span><br />
          Angebot ab {geld(k.pMinS, sc)}<br />Menge {fmt(angebot)}
        </div>
        <div className="rounded-lg bg-slate-100 px-2 py-1 leading-tight text-right">
          <span className="font-bold text-sky-700">Konsumenten</span><br />
          max. {geld(k.pMaxD, sc)}<br />Käufer {fmt(nachfrage)}
        </div>
      </div>
    </div>
  );
}

function loadProgress() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && raw.stats) return { ...DEFAULT_PROGRESS, ...raw, stats: { ...leerStats(), ...raw.stats } };
  } catch (e) { /* Speicher nicht verfügbar (z. B. Privatmodus) – dann ohne Speichern weiterspielen */ }
  return { ...DEFAULT_PROGRESS, stats: leerStats() };
}

function Regler({ s, wert, onChange }) {

    <div className="py-1.5">

function Aufgabenkarte({ task, nr, gesamt, answers, setAnswer, attempt, result, tippAn, setTippAn,
                         zeigLoesung, setZeigLoesung, onPruefen, onWeiter }) {
  const fertig = result && result.fertig;
  const stufe = STUFEN.find(s => s.nr === task.stufe);
  const feldOk = (k) => result && result.fr ? result.fr[k] : null;

  return (
    <div className="card overflow-hidden">
      <div className="flex items-center justify-between gap-2 px-3 py-2 bg-blue-50 border-b border-blue-100">
        <div className="min-w-0">
          <div className="cap text-blue-800">Aufgabe {nr} von {gesamt}</div>
          <div className="text-sm font-bold text-slate-800 truncate">{stufe.emoji} {task.titel}</div>
        </div>
        <span className="shrink-0 text-[11px] font-bold px-2 py-1 rounded-full bg-white border border-blue-200 text-blue-700">
          Stufe {task.stufe}
        </span>
      </div>

      <div className="p-3 space-y-2">
        <div className="flex items-center gap-2 text-sm font-semibold text-slate-700">
          <span className="text-xl">{task.sc.emoji}</span> Markt für {task.sc.name}
        </div>

        {task.aufgabe.map((abs, i) => abs === 'FUNKTIONEN'
          ? <FunktionsBox key={i} m={task.m} />
          : <p key={i} className="text-[13.5px] leading-relaxed text-slate-700">{abs}</p>)}

        {/* Auswahlfragen */}
        {(task.choices || []).map(c => (
          <div key={c.key} className="pt-1">
            <div className="text-[13px] font-semibold text-slate-800 mb-1.5">{c.frage}</div>
            <div className="space-y-1.5">
              {c.options.map((o, i) => {
                const gewaehlt = answers[c.key] === i;
                let stil = 'border-slate-200 bg-white';
                if (fertig && i === c.correct) stil = 'border-green-500 bg-green-50';
                else if (fertig && gewaehlt) stil = 'border-red-400 bg-red-50';
                else if (gewaehlt) stil = 'border-blue-500 bg-blue-50 ring-2 ring-blue-200';
                return (
                  <button key={i} disabled={fertig}
                    onClick={() => setAnswer(c.key, i)}
                    className={`w-full text-left text-[13px] leading-snug px-3 py-2 rounded-lg border-2 transition ${stil}`}>
                    <span className="font-bold mr-1.5">{String.fromCharCode(65 + i)})</span>{o}
                    {fertig && i === c.correct && <span className="ml-1 text-green-700 font-bold">✓</span>}
                  </button>
                );
              })}
            </div>
          </div>
        ))}

        {/* Rechenfelder */}
        {task.fields.length > 0 && (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
            {task.fields.map(f => {
              const ok = feldOk(f.key);
              return (
                <label key={f.key} className="block">
                  <span className="block text-[12px] text-slate-600 mb-1 leading-tight">{f.label}</span>
                  <div className="flex items-center gap-1.5">
                    <input
                      type="text" inputMode="decimal" autoComplete="off"
                      disabled={fertig}
                      value={answers[f.key] || ''}
                      onChange={e => setAnswer(f.key, e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter' && !fertig) onPruefen(); }}
                      placeholder="?"
                      className={`num-input w-full px-2.5 py-2 rounded-lg border-2 text-[15px] font-semibold text-right
                        ${ok === true ? 'border-green-500 bg-green-50 text-green-800'
                        : ok === false ? 'border-red-400 bg-red-50 text-red-700'
                        : 'border-slate-300 bg-white focus:border-blue-500 focus:outline-none'}`} />
                    <span className="text-[12px] text-slate-500 w-12 shrink-0">{f.unit}</span>
                  </div>
                  {fertig && ok === false && (
                    <span className="text-[11.5px] text-red-600">richtig: {fmt(f.correct, f.dec)} {f.unit}</span>
                  )}
                </label>
              );
            })}
          </div>
        )}

        {/* Rückmeldung */}
        {result && !result.ok && !result.fertig && (
          <div className="rounded-lg border-2 border-amber-400 bg-amber-50 px-3 py-2 text-[13px] text-amber-900 font-semibold pop">
            Noch nicht ganz richtig – schau dir die rot markierten Felder nochmal an. Du hast noch einen Versuch.
          </div>
        )}
        {result && result.ok && (
          <div className="rounded-lg border-2 border-green-500 bg-green-50 px-3 py-2 text-[13px] text-green-800 font-semibold pop">
            ✅ Richtig! {result.coins > 0 && <>+{result.coins} Münzen</>}{attempt > 0 && ' (im zweiten Versuch)'}
          </div>
        )}
        {result && !result.ok && result.fertig && (
          <div className="rounded-lg border-2 border-red-400 bg-red-50 px-3 py-2 text-[13px] text-red-800 font-semibold pop">
            ❌ Leider nicht richtig. Sieh dir den Lösungsweg an – die nächste Aufgabe schaffst du!
          </div>
        )}

        {/* Tipp */}
        {tippAn
          ? <Maskottchen text={task.tipp} figur="🧑‍🏫" />
          : !fertig && (
            <button onClick={() => setTippAn(true)}
              className="text-[12.5px] font-semibold text-amber-700 underline underline-offset-2">
              💡 Tipp anzeigen
            </button>)}

        {/* Lösungsweg */}
        {fertig && (
          <div>
            <button onClick={() => setZeigLoesung(v => !v)}
              className="text-[12.5px] font-semibold text-blue-700 underline underline-offset-2">
              {zeigLoesung ? 'Lösungsweg ausblenden' : '📖 Lösungsweg anzeigen'}
            </button>
            {zeigLoesung && (
              <ol className="mt-2 space-y-1.5 rounded-lg bg-slate-50 border border-slate-200 p-3">
                {task.loesung.map((z, i) => (
                  <li key={i} className="text-[12.5px] leading-relaxed text-slate-700 flex gap-2">
                    <span className="shrink-0 w-5 h-5 rounded-full bg-blue-600 text-white text-[11px] font-bold flex items-center justify-center">{i + 1}</span>
                    <span className="font-mono">{z}</span>
                  </li>
                ))}
              </ol>
            )}
          </div>
        )}

        {/* Buttons */}
        <div className="flex gap-2 pt-1">
          {!fertig
            ? <button onClick={onPruefen}
                className="knopf flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">
                {attempt === 0 ? 'Lösung prüfen' : 'Nochmal prüfen'}
              </button>
            : <button onClick={onWeiter}
                className="knopf flex-1 py-3 rounded-xl bg-green-600 text-white font-bold text-sm">
                {nr === gesamt ? 'Runde abschließen 🏁' : 'Nächste Aufgabe →'}
              </button>}
        </div>
      </div>
    </div>
  );
}


/* ============================================================
   9b. MISSIONEN – geführte Aufgabenfolge auf dem gewählten Markt
   Muster: PROGNOSTIZIEREN → BERECHNEN → SIMULIEREN → BEOBACHTEN → ERKLÄREN

   Schrittarten:
     rechnen   – Eingabefelder, Sollwerte stehen fest (eigener Übungsmarkt)
     ablesen   – Eingabefelder, Sollwerte werden beim Prüfen aus der
                 laufenden Simulation berechnet (Beobachtungsschritt)
     wahl      – Auswahlfrage
     regler    – ein bestimmter Regler muss auf einen Zielwert gestellt sein
     bedingung – die Simulation muss eine Bedingung erfüllen (Experiment)
     notiz     – freie Begründung, wird nicht bewertet, Musterlösung danach
   ============================================================ */
const AUF_SCHRITT = (v, step) => Math.round(v / step) * step;
const GRADED = ['rechnen', 'ablesen', 'wahl', 'regler', 'bedingung'];

function macheMission(sc, basis) {
  const uebung = makeMarket(sc);                 // eigener Übungsmarkt mit glatten Zahlen
  const ku = marktKennzahlen(uebung);
  const komp = sc.parameter.find(p => p.key === 'komplement');
  const eink = sc.parameter.find(p => p.key === 'einkommen');
  const kBasis = marktKennzahlen(basis);

  const kompZiel = AUF_SCHRITT(komp.basis + (komp.max - komp.basis) * 0.7, komp.step);
  const zielMenge = Math.round((kBasis.Q * 1.12) / 10) * 10;
  let noetigesEinkommen = eink.max;
  const startW = startParameter(sc, basis);
  for (let v = eink.basis; v <= eink.max + 1e-9; v += eink.step) {
    if (marktKennzahlen(simulierterMarkt(sc, basis, { ...startW, einkommen: v })).Q >= zielMenge) {
      noetigesEinkommen = v; break;
    }
  }

  const aufgaben = [
    {
      id:'gleichgewicht', titel:'Gleichgewicht bestimmen', kurz:'Gleichgewicht bestimmen',
      phase:'BERECHNEN', markt: uebung, zeigFunktionen: true,
      einleitung:`Für den Markt für ${sc.name} gelten die folgenden Funktionen (P in ${pEinheit(sc)}, Menge in ${sc.qUnit}):`,
      schritte:[{
        art:'rechnen', text:'Bestimme rechnerisch den Gleichgewichtspreis P* und die Gleichgewichtsmenge Q*.',
        tipp:'Setze Qd = Qs, löse nach P auf und setze P anschließend in eine der beiden Gleichungen ein.',
        felder:[
          { key:'p', label:'P* =', unit:pEinheit(sc), correct:ku.P, tol:0.02, dec:2 },
          { key:'q', label:'Q* =', unit:sc.qUnit, correct:ku.Q, tol:0.5, dec:0 },

/* Einen Schritt prüfen. ctx = { sc, simMarkt, werte } liefert den Live-Zustand. */
// Kleinster Wert eines Reglers, mit dem die Zielmenge im aktuellen Zustand erreicht wird
function minimalerReglerwert(ctx, key, ziel) {
  const par = ctx.sc.parameter.find(p => p.key === key);
  for (let v = par.min; v <= par.max + 1e-9; v += par.step) {
    const m = simulierterMarkt(ctx.sc, ctx.basis, { ...ctx.werte, [key]: v });
    if (marktKennzahlen(m).Q >= ziel - 0.5) return Math.round(v / par.step) * par.step;
  }
  return par.max;
}

function pruefeSchritt(schritt, antworten, praefix, ctx) {
  const feld = {}; let ok = true, deine = [], richtig = [];
  if (schritt.art === 'rechnen' || schritt.art === 'ablesen') {
    const kLive = ctx ? marktKennzahlen(ctx.simMarkt) : null;
    for (const f of schritt.felder) {
      const soll = schritt.art === 'ablesen' ? (f.was === 'P' ? kLive.P : kLive.Q)
        : f.liveMin ? minimalerReglerwert(ctx, f.liveMin, schritt.ziel)
        : f.correct;
      const tol = schritt.art === 'ablesen'
        ? (f.was === 'P' ? Math.max(0.02, Math.abs(soll) * 0.005) : Math.max(1, Math.abs(soll) * 0.005))
        : f.tol;
      const v = parseNum(antworten[praefix + f.key] || '');
      const gut = isFinite(v) && Math.abs(v - soll) <= tol;
      feld[f.key] = { ok: gut, soll };
      if (!gut) ok = false;
      deine.push(isFinite(v) ? fmt(v, f.dec) : '–');
      richtig.push(fmt(soll, f.dec));
    }
  } else if (schritt.art === 'wahl') {
    const a = antworten[praefix + 'wahl'];
    ok = a === schritt.richtig;
    deine.push(a == null ? '–' : String.fromCharCode(65 + a));
    richtig.push(String.fromCharCode(65 + schritt.richtig));
  } else if (schritt.art === 'regler') {
    const par = ctx.sc.parameter.find(p => p.key === schritt.parameter);
    const v = ctx.werte[schritt.parameter];
    ok = Math.abs(v - schritt.ziel) <= par.step * 0.51;
    deine.push(fmt(v, par.step < 1 ? 2 : 0));
    richtig.push(fmt(schritt.ziel, par.step < 1 ? 2 : 0));
  } else if (schritt.art === 'bedingung') {
    const k = marktKennzahlen(ctx.simMarkt);
    ok = schritt.pruefung === 'menge_min' ? k.Q >= schritt.ziel - 0.5 : true;
    deine.push(fmt(k.Q) + ' ' + ctx.sc.qUnit);
    richtig.push('≥ ' + fmt(schritt.ziel) + ' ' + ctx.sc.qUnit);
  } else {
    ok = true;                                   // Notizschritt wird nicht bewertet
  }
  return { ok, feld, deine: deine.join(' / '), richtig: richtig.join(' / ') };
}

const preisSchritt = (pMax) => {
  const roh = pMax / 60, mag = Math.pow(10, Math.floor(Math.log10(roh))), n = roh / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
};

const marktAnteil = (eigen, konkurrenz) => clamp(0.5 + 2 * (konkurrenz - eigen) / konkurrenz, 0.05, 0.95);

function absatzBei(g, preis) {
  const roh = Math.max(0, qd(g.markt, preis)) * marktAnteil(preis, g.konkurrenz);
  const menge = Math.round(roh);
  return g.kapazitaet != null ? Math.min(menge, g.kapazitaet) : menge;
}
const gewinnBei = (g, preis) => (preis - g.stueckkosten) * absatzBei(g, preis) - g.fixkosten;

function besterPreis(g) {
  const max = prohibitiv(g.markt), schritt = Math.max(0.5, preisSchritt(max) / 4);
  let best = { preis: g.stueckkosten, gewinn: -Infinity };
  for (let p = g.stueckkosten; p <= max; p += schritt) {
    const w = gewinnBei(g, p);
    if (w > best.gewinn) best = { preis: p, gewinn: w };
  }
  return best;
}

// Für das Spiel braucht es Luft zwischen Stückkosten und Prohibitivpreis,
// sonst ist nach ein paar negativen Ereignissen kein Gewinn mehr möglich.
function spielMarkt(sc) {
  let letzter = null;
  for (let i = 0; i < 60; i++) {
    const m = makeMarket(sc), k = marktKennzahlen(m);
    if (k.pMinS >= 1 && k.pMinS <= 0.45 * k.pMaxD) return m;
    letzter = m;
  }
  return letzter;
}

function neuesSpiel(scKey) {
  const sc = scKey ? scById(scKey) : pick(SPIEL_SZENARIEN);
  const m = spielMarkt(sc), k = marktKennzahlen(m);
  const g = {
    sc, markt:{ a:m.a, b:m.b, c:m.c, d:m.d }, marktVorher:null,
    stueckkosten: k.pMinS, startKosten: k.pMinS, startA: m.a,
    fixkosten: Math.round(0.18 * (k.P - k.pMinS) * k.Q),
    konkurrenz: k.P, kapazitaet: null,
    runde: 1, phase: 'karte', konto: 0, sterneGesamt: 0,
    ereignis: null, mcAntwort: null, mcGeprueft: false,
    preis: k.P, schaetzung: '', ergebnis: null, verlauf: [], letzteIds: [],
  };
  ziehEreignis(g);
  return g;
}

function ereignisAnwenden(g, ev) {
  if (ev.art === 'nachfrage') {
    g.markt.a = Math.round(g.markt.a * (1 + ev.vz * ev.staerke));
  } else if (ev.art === 'kosten') {
    const delta = ev.vz * Math.max(1, Math.round(g.stueckkosten * ev.staerke));
    g.stueckkosten = Math.max(1, g.stueckkosten + delta);
    g.markt.c = g.markt.c - g.markt.d * delta;      // Kostenänderung verschiebt die Angebotskurve
  } else if (ev.art === 'konkurrenz') {
    g.konkurrenz = Math.round(g.konkurrenz * (1 + ev.vz * ev.staerke));
    if (ev.angebotRechts) g.markt.c = Math.round(g.markt.c + g.markt.d * Math.max(1, g.stueckkosten * 0.08));
  } else if (ev.art === 'kapazitaet') {
    g.kapazitaet = Math.max(10, Math.round(absatzBei({ ...g, kapazitaet: null }, g.konkurrenz) * 0.6));
  }
}

// Damit der Markt über acht Runden nicht ins Unspielbare driftet: Nachfrage,
// Stückkosten und Konkurrenzpreis bleiben in einem Korridor um die Startwerte.
function grenzenEinhalten(g) {
  g.markt.a = clamp(g.markt.a, Math.round(g.startA * 0.72), Math.round(g.startA * 1.6));
  const pMax = prohibitiv(g.markt);
  g.stueckkosten = clamp(g.stueckkosten,
    Math.max(1, Math.round(g.startKosten * 0.55)),
    Math.min(Math.round(0.55 * pMax), Math.round(g.startKosten * 1.8)));
  g.konkurrenz = clamp(g.konkurrenz, Math.round(g.stueckkosten * 1.15), Math.round(0.92 * pMax));
}

function wirkungSpuerbar(g, vor, ev) {
  if (ev.art === 'nachfrage') return Math.abs(g.markt.a / vor.markt.a - 1) >= 0.04;
  if (ev.art === 'kosten') return g.stueckkosten !== vor.stueckkosten;
  if (ev.art === 'konkurrenz') return g.konkurrenz !== vor.konkurrenz;
  return true;
}

function ziehEreignis(g) {
  const vor = { markt: { ...g.markt }, stueckkosten: g.stueckkosten, konkurrenz: g.konkurrenz };
  const moeglich = SPIEL_EREIGNISSE.filter(e => !g.letzteIds.includes(e.id));
  const pool = moeglich.length ? moeglich : SPIEL_EREIGNISSE;
  let ev = null;

  // Ein Ereignis nur nehmen, wenn es spürbar wirkt UND die Runde gewinnbar bleibt
  for (let versuch = 0; versuch < 8; versuch++) {
    g.markt = { ...vor.markt }; g.stueckkosten = vor.stueckkosten;
    g.konkurrenz = vor.konkurrenz; g.kapazitaet = null;
    ev = pick(pool);
    ereignisAnwenden(g, ev);
    grenzenEinhalten(g);
    if (wirkungSpuerbar(g, vor, ev) && besterPreis(g).gewinn > 0.05 * g.fixkosten) break;
  }

  g.marktVorher = { ...vor.markt };
  g.kostenVorher = vor.stueckkosten;
  g.konkurrenzVorher = vor.konkurrenz;
  g.letzteIds = [ev.id, ...g.letzteIds].slice(0, 4);
  g.ereignis = ev;
  g.mcAntwort = null; g.mcGeprueft = false; g.ergebnis = null; g.schaetzung = '';
  g.preis = clamp(g.preis, g.stueckkosten, prohibitiv(g.markt));
}

function ereignisFolge(g) {
  const ev = g.ereignis;
  if (!ev) return '';
  if (ev.art === 'nachfrage') {
    const pct = Math.round((g.markt.a / g.marktVorher.a - 1) * 100);
    return `Die nachgefragte Menge liegt jetzt bei jedem Preis um ${Math.abs(pct)} % ${pct > 0 ? 'höher' : 'niedriger'}.`;
  }
  if (ev.art === 'kosten') return `Deine Stückkosten ändern sich von ${eur(g.kostenVorher)} auf ${eur(g.stueckkosten)}.`;
  if (ev.art === 'konkurrenz') return `Der Konkurrenzpreis ändert sich von ${eur(g.konkurrenzVorher)} auf ${eur(g.konkurrenz)}.`;
  if (ev.art === 'kapazitaet') return `Du kannst diese Runde höchstens ${fmt(g.kapazitaet)} ${g.sc.qUnit} produzieren.`;
  return '';
}

              <div key={i} className="flex justify-between py-1 border-b border-dashed border-slate-200">
                <span className="text-slate-500">{l}</span><span className="num-input font-semibold">{w}</span>
              </div>
            ))}

              <span>Gewinn</span><span className={`num-input ${e.gewinn >= 0 ? 'text-green-700' : 'text-red-600'}`}>{eur(e.gewinn)}</span>
            </div>
          </div>

          {e.schaetzungText && (
            <div className={`rounded-lg border-2 px-3 py-2 text-[12.5px] font-semibold ${e.schaetzungOk
              ? 'border-green-500 bg-green-50 text-green-800' : 'border-amber-400 bg-amber-50 text-amber-900'}`}>
              {e.schaetzungText}
            </div>
          )}

          <Maskottchen figur="🧑‍🏫" text={
            e.sterne === 3
              ? <>Sehr gut kalkuliert. Der bestmögliche Preis lag bei <b>{eur(e.bestPreis)}</b> mit {eur(e.bestGewinn)} Gewinn – du warst praktisch am Optimum.</>
              : <>Mit einem Preis von <b>{eur(e.bestPreis)}</b> wären in dieser Runde <b>{eur(e.bestGewinn)}</b> möglich gewesen
                 ({e.preis > e.bestPreis ? 'dein Preis war zu hoch – zu viele Kunden sind zur Konkurrenz gegangen'
                   : 'dein Preis war zu niedrig – die Marge je Stück war zu klein'}).</>
          } />

          {e.muenzen > 0 && (
            <div className="text-center text-[12.5px] font-bold text-amber-700">+{e.muenzen} 🪙 in dieser Runde</div>
          )}

          <button onClick={onNaechste} className="knopf mt-1 w-full py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">
            {g.runde >= SPIEL_RUNDEN ? 'Zur Abrechnung 🏁' : 'Nächste Runde →'}
          </button>
        </Card>
      )}
    </div>
  );
}

/* ---------- Ergebnisraster unter dem Diagramm ---------- */
function ErgebnisRaster({ sc, markt, preis }) {
  const k = marktKennzahlen(markt);
  const n = Math.max(0, qd(markt, preis)), a = Math.max(0, qs(markt, preis));
  const diff = a - n;
  const felder = [
    { s:'muenze', l:'Gleichgewichtspreis', v:geld(k.P, sc),               f:'text-amber-600' },
    { s:'paket',  l:'Gleichgewichtsmenge', v:`${fmt(k.Q)} ${sc.qUnit}`,   f:'text-amber-600' },
    { s:'kurveN', l:`Nachfrage bei ${geld(preis, sc)}`, v:`${fmt(n)} ${sc.qUnit}`, f:'text-blue-600' },
    { s:'kurveA', l:`Angebot bei ${geld(preis, sc)}`,   v:`${fmt(a)} ${sc.qUnit}`, f:'text-red-600' },
    { s:'flaecheGruen', l:'Konsumentenrente', v:geld(k.KR, sc),           f:'text-green-700' },
    { s:'flaecheRot',   l:'Produzentenrente', v:geld(k.PR, sc),           f:'text-red-600' },
  ];
  return (
    <div>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">

          <div key={x.l} className="flex items-center gap-2 rounded-lg bg-[#FBF8F1] border border-[#EAE2D2] px-2 py-1.5">
            <span className="shrink-0"><Pixel name={x.s} size={2} /></span>
            <span className="min-w-0">
              <span className="block text-[10px] text-slate-500 leading-tight">{x.l}</span>
              <span className={`block text-[13px] font-bold num-input leading-tight ${x.f}`}>{x.v}</span>
            </span>
          </div>
        ))}
      </div>
      <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500">
        <span>Gesamtwohlfahrt <b className="num-input text-slate-700">{geld(k.W, sc)}</b></span>
        <span>Prohibitivpreis <b className="num-input text-slate-700">{geld(k.pMaxD, sc)}</b></span>
        <span>Mindestangebotspreis <b className="num-input text-slate-700">{geld(k.pMinS, sc)}</b></span>

/* ---------- 2 · Parameter festlegen ---------- */
function ParameterPanel({ sc, werte, setWert, pMax, onReset }) {
  const schritt = preisSchritt(pMax);
  return (
    <div>
      {/* Preis des Gutes: Bewegung AUF der Kurve */}
      <div className="pb-2 mb-2 border-b border-slate-200">
        <div className="flex items-center justify-between gap-2 mb-0.5">

          <div key={par.key} className="py-1.5">
            <div className="flex items-start justify-between gap-2 mb-0.5">

              </span>

            <input type="range" min={par.min} max={par.max} step={par.step} value={v}
                   onChange={e => setWert(par.key, Number(e.target.value))} />

              <div className="text-[10.5px] font-semibold text-blue-600">

      <button onClick={onReset}

        ⟳ Zurücksetzen

/* ---------- 3b · Aktuelle Marktlage ---------- */
function Marktlage({ sc, markt, preis }) {
  const k = marktKennzahlen(markt);
  const n = qd(markt, preis), a = qs(markt, preis), diff = a - n;
  const Zeile = ({ l, v, farbe = 'text-slate-800', stark }) => (
    <div className="flex items-baseline justify-between gap-2 py-[3px] border-b border-dashed border-slate-200 last:border-0">
      <span className="text-[11px] text-slate-500 leading-tight min-w-0">{l}</span>
      <span className={`num-input whitespace-nowrap shrink-0 ${stark ? 'text-[13.5px] font-bold' : 'text-[12.5px] font-semibold'} ${farbe}`}>{v}</span>
    </div>
  );
  return (
    <div>
      <Zeile l={'Gleichgewichts\u00ADpreis'} v={geld(k.P, sc)} farbe="text-amber-600" stark />
      <Zeile l={'Gleichgewichts\u00ADmenge'} v={`${fmt(k.Q)} ${sc.qUnit}`} farbe="text-amber-600" stark />
      <Zeile l={`Nachfrage bei ${geld(preis, sc)}`} v={`${fmt(Math.max(0, n))} ${sc.qUnit}`} farbe="text-blue-600" />
      <Zeile l={`Angebot bei ${geld(preis, sc)}`} v={`${fmt(Math.max(0, a))} ${sc.qUnit}`} farbe="text-red-600" />
      <Zeile l={Math.abs(diff) < 0.5 ? 'Markt geräumt' : diff > 0 ? 'Angebotsüberschuss' : 'Nachfrageüberschuss'}
             v={Math.abs(diff) < 0.5 ? '0' : fmt(Math.abs(diff))}
             farbe={Math.abs(diff) < 0.5 ? 'text-green-600' : 'text-purple-700'} />
      <Zeile l={'Konsumenten\u00ADrente'} v={geld(k.KR, sc)} farbe="text-green-700" />
      <Zeile l={'Produzenten\u00ADrente'} v={geld(k.PR, sc)} farbe="text-red-600" />
      <Zeile l={'Gesamt\u00ADwohlfahrt'} v={geld(k.W, sc)} />
      <Zeile l={'Prohibitiv\u00ADpreis'} v={geld(k.pMaxD, sc)} />
      <Zeile l={'Mindest\u00ADangebotspreis'} v={geld(k.pMinS, sc)} />
    </div>
  );
}

/* ---------- 4 · Aufgaben (Mission) ---------- */
function MissionPanel({ mission, ctx, onAntwort, onPruefen, onWeiter, onTipp, onNeu, fertig }) {
  if (!mission) return null;
  const n = mission.aufgaben.length;

  if (mission.aktiv >= n) {
    const punkte = mission.ergebnisse.reduce((s, e) => s + e.punkte, 0);
    const max = mission.ergebnisse.reduce((s, e) => s + e.max, 0);
    return (
      <div className="text-center py-3">
        <div className="text-4xl mb-1">{punkte >= max * 0.8 ? '🏆' : '💪'}</div>
        <div className="text-lg font-bold text-slate-800">{punkte} von {max} Punkten</div>
        <p className="text-[12.5px] text-slate-500 mt-1">Mission abgeschlossen. Wähle ein anderes Gut oder starte eine neue Mission.</p>
        <button onClick={onNeu} className="knopf mt-3 w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-[13px]">
          🔁 Neue Mission
        </button>
      </div>
    );
  }

  const auf = mission.aufgaben[mission.aktiv];
  const schritt = auf.schritte[mission.schritt];
  const pre = `${mission.aktiv}.${mission.schritt}.`;
  const res = mission.res;
  const erledigt = res && (res.ok || mission.versuch >= 2);
  const par = schritt.art === 'regler' ? ctx.sc.parameter.find(p => p.key === schritt.parameter) : null;

  // Live-Rückmeldung für Simulations- und Experimentierschritte
  let liveOk = null;
  if (schritt.art === 'regler') liveOk = Math.abs(ctx.werte[schritt.parameter] - schritt.ziel) <= par.step * 0.51;
  if (schritt.art === 'bedingung') liveOk = marktKennzahlen(ctx.simMarkt).Q >= schritt.ziel - 0.5;

  return (
    <div>
      <div className="flex items-center justify-between gap-2">
        <span className="text-[12px] font-bold text-slate-700">Aufgabe {mission.aktiv + 1} von {n}</span>
        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 border border-blue-200 text-blue-700">
          {schritt.phase || auf.phase}
        </span>
      </div>
      <h3 className="text-[13.5px] font-bold text-slate-800 mt-0.5">{auf.titel}</h3>

      {mission.schritt === 0 && auf.einleitung && (
        <p className="text-[12.5px] text-slate-600 leading-snug mt-1">{auf.einleitung}</p>
      )}
      {auf.zeigFunktionen && <>
        <FunktionsBox m={mission.uebung} />
        <p className="text-[11px] text-slate-400 leading-snug -mt-1 mb-1">
          Reine Rechenaufgabe: Diese Zahlen gehören zur Aufgabe, nicht zur Simulation links.
        </p>
      </>}

      {/* bereits erledigte Schritte */}
      {auf.schritte.slice(0, mission.schritt).map((s, i) => (
        <div key={i} className="mt-1.5 text-[11.5px] text-green-700 bg-green-50 border border-green-200 rounded px-2 py-1 leading-snug">
          ✓ {s.phase ? s.phase.split('·').pop().trim() + ': ' : ''}erledigt
        </div>
      ))}

      <p className="text-[13px] text-slate-700 leading-snug mt-2 font-medium">{schritt.text}</p>

      {/* Auswahlfrage */}
      {schritt.art === 'wahl' && (
        <div className="space-y-1.5 mt-2">
          {schritt.optionen.map((o, i) => {
            const gewaehlt = mission.antworten[pre + 'wahl'] === i;
            let stil = 'border-slate-200 bg-white';
            if (erledigt && i === schritt.richtig) stil = 'border-green-500 bg-green-50';
            else if (res && !res.ok && gewaehlt) stil = 'border-red-400 bg-red-50';
            else if (gewaehlt) stil = 'border-blue-500 bg-blue-50 ring-2 ring-blue-200';
            return (
              <button key={i} disabled={erledigt} onClick={() => onAntwort(pre + 'wahl', i)}
                className={`w-full text-left text-[12.5px] leading-snug px-2.5 py-1.5 rounded-lg border-2 ${stil}`}>
                <span className="font-bold mr-1">{String.fromCharCode(65 + i)})</span>{o}
              </button>
            );
          })}
        </div>
      )}

      {/* Rechen- oder Ablesefelder */}
      {(schritt.art === 'rechnen' || schritt.art === 'ablesen') && (
        <div className="space-y-1.5 mt-2">
          {schritt.felder.map(f => {
            const st = res && res.feld ? res.feld[f.key] : null;
            return (
              <div key={f.key} className="flex items-center gap-2">
                <span className="text-[12px] text-slate-600 flex-1 leading-tight">{f.label}</span>
                <input type="text" inputMode="decimal" disabled={erledigt}
                  value={mission.antworten[pre + f.key] || ''}
                  onChange={e => onAntwort(pre + f.key, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter' && !erledigt) onPruefen(); }}
                  className={`num-input w-24 px-2 py-1.5 rounded-lg border-2 text-[14px] font-semibold text-right
                    ${st && st.ok ? 'border-green-500 bg-green-50 text-green-800'
                      : st && !st.ok ? 'border-red-400 bg-red-50 text-red-700'
                      : 'border-slate-300 bg-white focus:border-blue-500 focus:outline-none'}`} />
                <span className="text-[11px] text-slate-500 w-14 shrink-0">{f.unit}</span>
              </div>
            );
          })}
          {res && !res.ok && res.feld && schritt.felder.some(f => res.feld[f.key] && !res.feld[f.key].ok) && mission.versuch >= 2 && (
            <div className="text-[11.5px] text-red-600">
              richtig: {schritt.felder.map(f => `${f.label} ${fmt(res.feld[f.key].soll, f.dec)}`).join(' · ')}
            </div>
          )}
        </div>
      )}

      {/* Simulations- und Experimentierschritt */}
      {(schritt.art === 'regler' || schritt.art === 'bedingung') && (
        <div className={`mt-2 rounded-lg border-2 px-2.5 py-2 text-[12px] font-semibold ${liveOk
          ? 'border-green-500 bg-green-50 text-green-800' : 'border-amber-300 bg-amber-50 text-amber-900'}`}>
          {liveOk ? '✓ Einstellung erreicht – jetzt prüfen.' : 'Noch nicht erreicht. Stelle den Regler links im Bereich 2 ein.'}
          {schritt.art === 'bedingung' && (
            <div className="font-normal mt-0.5">
              aktuelle Gleichgewichtsmenge: {fmt(marktKennzahlen(ctx.simMarkt).Q)} {ctx.sc.qUnit} · Ziel: ≥ {fmt(schritt.ziel)}
            </div>
          )}
        </div>
      )}

      {/* Notiz */}
      {schritt.art === 'notiz' && (
        <div className="mt-2">
          <textarea rows="3" value={mission.antworten[pre + 'notiz'] || ''}
            onChange={e => onAntwort(pre + 'notiz', e.target.value)}
            placeholder="Deine Begründung …"
            className="w-full px-2 py-1.5 rounded-lg border-2 border-slate-300 focus:border-blue-500 focus:outline-none text-[12.5px]" />
          {erledigt && (
            <div className="mt-1.5 rounded-lg bg-slate-50 border border-slate-200 p-2 text-[12px] text-slate-700 leading-snug">
              <b>Musterlösung:</b> {schritt.muster}
            </div>
          )}
        </div>
      )}

      {/* Rückmeldung */}
      {res && (
        <div className={`mt-2 rounded-lg border-2 px-2.5 py-1.5 text-[12.5px] font-semibold pop ${res.ok
          ? 'border-green-500 bg-green-50 text-green-800' : 'border-red-400 bg-red-50 text-red-800'}`}>
          {res.ok ? '✅ Richtig!' : mission.versuch >= 2 ? '❌ Leider nicht richtig.' : '⚠️ Noch nicht richtig – versuch es noch einmal.'}
          {res.ok && schritt.erklaerung && <div className="font-normal mt-1">{schritt.erklaerung}</div>}
        </div>
      )}
      {mission.zeigLoesung && schritt.loesung && (
        <ol className="mt-2 space-y-1 rounded-lg bg-slate-50 border border-slate-200 p-2">
          {schritt.loesung.map((z, i) => <li key={i} className="text-[11.5px] font-mono text-slate-700 leading-relaxed">{i + 1}. {z}</li>)}
        </ol>
      )}
      {mission.tippAn && schritt.tipp && <div className="mt-2"><Maskottchen figur="🧑‍🏫" text={schritt.tipp} /></div>}

      <div className="flex gap-2 mt-2.5">
        {!erledigt ? (
          <>
            <button onClick={onPruefen}
              className="knopf flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-[13px]">
              Lösung prüfen
            </button>
            {schritt.tipp && !mission.tippAn && (
              <button onClick={onTipp} className="knopf px-3 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-700 font-bold text-[13px]">💡</button>
            )}
          </>
        ) : (
          <button onClick={onWeiter}
            className="knopf flex-1 py-2.5 rounded-xl bg-green-600 text-white font-bold text-[13px]">
            {mission.schritt + 1 < auf.schritte.length ? 'Weiter →'
              : mission.aktiv + 1 < n ? 'Nächste Aufgabe →' : 'Mission abschließen 🏆'}
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-slate-200 text-[11px]">
        <span className="text-slate-500 font-semibold">BELOHNUNG</span>
        <span className="flex items-center gap-1 font-bold text-amber-600"><Pixel name="stern" size={1.6} /> +20</span>
        <span className="flex items-center gap-1 font-bold text-green-600">XP +50</span>
      </div>
    </div>
  );
}

/* ---------- 5 · Tiefer gehen ---------- */
const ANALYSE_TABS = [
  { key:'preis', label:'Preisänderung', par:'preis', braucht:'gleichgewicht',
    frage:'Was passiert, wenn sich der Preis des Gutes selbst ändert?',
    fazit:'Eine Änderung des Güterpreises verschiebt die Kurven nicht. Man bewegt sich nur auf der Nachfrage- bzw. Angebotskurve: Die nachgefragte Menge ändert sich, Gleichgewichtspreis und -menge bleiben gleich. Erst ein Nichtpreisfaktor verschiebt die ganze Kurve.' },
  { key:'einkommen', label:'Einkommensänderung', par:'einkommen', braucht:'einkommen',
    frage:'Was passiert, wenn sich das Einkommen der Konsumenten ändert?',
    fazit:'Bei einem normalen Gut verschiebt ein höheres Einkommen die Nachfragekurve nach rechts: Gleichgewichtspreis und Gleichgewichtsmenge steigen. Bei einem inferioren Gut wäre die Richtung umgekehrt.' },
  { key:'komplement', label:'Komplementärgut', par:'komplement', braucht:'komplement',
    frage:'Was passiert, wenn sich der Preis des Komplementärgutes ändert?',
    fazit:'Ein höherer Preis des Komplementärgutes verteuert das gemeinsam genutzte Paket. Die Nachfrage sinkt bei jedem Preis, die Nachfragekurve verschiebt sich nach links – Gleichgewichtspreis und -menge sinken.' },
  { key:'substitut', label:'Substitutionsgut', par:'substitut', braucht:null,
    frage:'Was passiert, wenn sich der Preis des Substitutionsgutes ändert?',
    fazit:'Wird das Ersatzgut teurer, weichen Konsumenten auf das betrachtete Gut aus. Die Nachfragekurve verschiebt sich nach rechts – Gleichgewichtspreis und -menge steigen.' },
  { key:'erwartung', label:'Erwartungen', par:'erwartung', braucht:null,
    frage:'Was passiert, wenn die Konsumenten künftig höhere Preise erwarten?',
    fazit:'Wer künftig steigende Preise erwartet, zieht Käufe in die Gegenwart vor. Die heutige Nachfragekurve verschiebt sich nach rechts – Gleichgewichtspreis und -menge steigen heute.' },
];

const Pfeil = ({ d }) => d > 0.0001 ? <span className="text-green-600 font-bold">↑</span>
  : d < -0.0001 ? <span className="text-red-600 font-bold">↓</span>
  : <span className="text-slate-400">→</span>;

function AnalysePanel({ sc, basis, werte, setWert, tab, setTab, geloest, pMax }) {
  const t = ANALYSE_TABS.find(x => x.key === tab) || ANALYSE_TABS[0];
  const par = t.par === 'preis' ? null : sc.parameter.find(p => p.key === t.par);
  const start = startParameter(sc, basis);

  // Für den Vergleich wird ausschließlich der Faktor dieses Reiters verändert
  const nachherWerte = { ...start, [t.par]: werte[t.par] };
  const vorherMarkt = simulierterMarkt(sc, basis, start);
  const nachherMarkt = simulierterMarkt(sc, basis, nachherWerte);
  const vP = start.preis;
  const nP = t.par === 'preis' ? werte.preis : start.preis;
  const kv = marktKennzahlen(vorherMarkt), kn = marktKennzahlen(nachherMarkt);
  const preisModus = t.par === 'preis';

  const zeilen = preisModus
    ? [
        ['Nachgefragte Menge', qd(nachherMarkt, nP) - qd(vorherMarkt, vP), `${fmt(Math.max(0, qd(nachherMarkt, nP)))} ${sc.qUnit}`],
        ['Angebotene Menge', qs(nachherMarkt, nP) - qs(vorherMarkt, vP), `${fmt(Math.max(0, qs(nachherMarkt, nP)))} ${sc.qUnit}`],
        ['Gleichgewichts\u00ADpreis', kn.P - kv.P, geld(kn.P, sc)],
        ['Gleichgewichts\u00ADmenge', kn.Q - kv.Q, `${fmt(kn.Q)} ${sc.qUnit}`],
      ]
    : [
        ['Gleichgewichts\u00ADpreis', kn.P - kv.P, geld(kn.P, sc)],
        ['Gleichgewichts\u00ADmenge', kn.Q - kv.Q, `${fmt(kn.Q)} ${sc.qUnit}`],
        ['Konsumenten\u00ADrente', kn.KR - kv.KR, geld(kn.KR, sc)],
        ['Produzenten\u00ADrente', kn.PR - kv.PR, geld(kn.PR, sc)],
      ];

  const frei = t.braucht ? geloest.includes(t.braucht) : geloest.length >= 2;

  return (
    <div>
      <div className="flex gap-1 overflow-x-auto pb-2 -mx-1 px-1">
        {ANALYSE_TABS.map(x => (
          <button key={x.key} onClick={() => setTab(x.key)}
            className={`shrink-0 px-2.5 py-1.5 rounded-lg text-[11.5px] font-semibold border ${x.key === tab
              ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
            {x.label}
          </button>
        ))}
      </div>

      <div className="grid gap-3 grid-cols-1 lg:grid-cols-[190px_minmax(0,1fr)_212px]">
        <div>
          <p className="text-[12.5px] text-slate-700 leading-snug font-medium">{t.frage}</p>
          <p className="text-[11.5px] text-slate-500 leading-snug mt-1">
            Verschiebe den Regler und beobachte die Auswirkungen auf Nachfrage, Gleichgewicht und Renten.
            Für diesen Vergleich wird <b>nur dieser eine Faktor</b> verändert (ceteris paribus).
          </p>
          <div className="mt-2 rounded-lg border border-slate-200 p-2">
            <div className="flex items-center justify-between mb-0.5">
              <span className="text-[11.5px] text-slate-600">{preisModus ? 'Preis des Gutes' : par.label}</span>
              <span className="text-[12px] font-bold num-input">
                {preisModus ? geld(werte.preis, sc)
                  : (par.einheit === '%' ? fmt(werte[par.key]) + ' %' : fmt(werte[par.key], par.step < 1 ? 2 : 0) + ' ' + par.einheit)}
              </span>
            </div>
            <input type="range"
              className={preisModus ? 'neutral' : ''}
              min={preisModus ? 0 : par.min} max={preisModus ? Math.round(pMax) : par.max}
              step={preisModus ? preisSchritt(pMax) : par.step}
              value={preisModus ? werte.preis : werte[par.key]}
              onChange={e => setWert(preisModus ? 'preis' : par.key, Number(e.target.value))} />
            <div className="flex justify-between text-[10px] text-slate-400">
              <span>{preisModus ? '0' : fmt(par.min, par.step < 1 ? 2 : 0)}</span>
              <span>{preisModus ? fmt(Math.round(pMax)) : fmt(par.max, par.step < 1 ? 2 : 0)}</span>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-1 items-center">
          <div>
            <div className="text-center text-[10.5px] font-bold text-slate-500 uppercase tracking-wider">Vorher</div>
            <div className="text-center text-[11px] text-slate-600 mb-0.5">
              P* = {geld(kv.P, sc)} · Q* = {fmt(kv.Q)}
            </div>
            <MarktChart m={vorherMarkt} sc={sc} mini showSurplus showEq priceLine={preisModus ? vP : undefined} />
          </div>
          <div className="text-2xl text-green-600 font-bold text-center">
            <span className="sm:hidden">↓</span><span className="hidden sm:inline">→</span>
          </div>
          <div>
            <div className="text-center text-[10.5px] font-bold text-slate-500 uppercase tracking-wider">Nachher</div>
            <div className="text-center text-[11px] text-slate-600 mb-0.5">
              P* = {geld(kn.P, sc)} · Q* = {fmt(kn.Q)}
            </div>
            <MarktChart m={nachherMarkt} sc={sc} mini showSurplus showEq
                        compare={preisModus ? undefined : vorherMarkt} priceLine={preisModus ? nP : undefined} />
          </div>
        </div>

        <div>
          <div className="cap mb-1">Änderungen</div>
          {zeilen.map(([l, d, v], i) => (
            <div key={i} className="flex items-center justify-between gap-1 py-1 border-b border-dashed border-slate-200 last:border-0">
              <span className="text-[11px] text-slate-500 leading-tight min-w-0">{l}</span>
              <span className="text-[11.5px] font-semibold num-input whitespace-nowrap shrink-0"><Pfeil d={d} /> {v}</span>
            </div>
          ))}
          <div className={`mt-2 rounded-lg border p-2 text-[11.5px] leading-snug ${frei
            ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
            <b>{frei ? '💡 Fazit' : '🔒 Fazit'}</b><br />
            {frei ? t.fazit : 'Das Fazit wird freigeschaltet, sobald du die passende Aufgabe im Bereich 4 bearbeitet hast.'}
          </div>
        </div>
      </div>
    </div>
  );
}

      {verlauf.length > 0 && (
        <p className="text-[10.5px] text-slate-400 mt-1">
          So kannst du verschiedene Marktsituationen nebeneinander vergleichen.
        </p>
