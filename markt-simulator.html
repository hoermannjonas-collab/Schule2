);

/* ---------- Ergebnisraster unter dem Diagramm ---------- */
function ErgebnisRaster({ sc, markt, preis }) {
  const k = marktKennzahlen(markt);
  const n = Math.max(0, qd(markt, preis)), a = Math.max(0, qs(markt, preis));
  const diff = a - n;
  const felder = [
    { s:'muenze', l:'Gleichgewichtspreis', v:geld(k.P, sc),               f:'text-amber-600' },
    { s:'paket',  l:'Gleichgewichtsmenge', v:`${fmt(k.Q)} ${sc.qUnit}`,   f:'text-amber-600' },
    { s:'kurveN', l:`Nachfrage bei ${geld(preis, sc)}`, v:`${fmt(n)} ${sc.qUnit}`, f:'text-blue-600' },
    { s:'kurveA', l:`Angebot bei ${geld(preis, sc)}`,   v:`${fmt(a)} ${sc.qUnit}`, f:'text-red-600' },
    { s:'flaecheGruen', l:'Konsumentenrente', v:geld(k.KR, sc),           f:'text-green-700' },
    { s:'flaecheRot',   l:'Produzentenrente', v:geld(k.PR, sc),           f:'text-red-600' },
  ];
  return (
    <div>
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
        {felder.map(x => (
          <div key={x.l} className="flex items-center gap-2 rounded-lg bg-[#FBF8F1] border border-[#EAE2D2] px-2 py-1.5">
            <span className="shrink-0"><Pixel name={x.s} size={2} /></span>
            <span className="min-w-0">
              <span className="block text-[10px] text-slate-500 leading-tight">{x.l}</span>
              <span className={`block text-[13px] font-bold num-input leading-tight ${x.f}`}>{x.v}</span>
            </span>
          </div>
        ))}
      </div>
      <div className="mt-2 flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500">
        <span>Gesamtwohlfahrt <b className="num-input text-slate-700">{geld(k.W, sc)}</b></span>
        <span>Prohibitivpreis <b className="num-input text-slate-700">{geld(k.pMaxD, sc)}</b></span>
        <span>Mindestangebotspreis <b className="num-input text-slate-700">{geld(k.pMinS, sc)}</b></span>
        <span className={Math.abs(diff) < 0.5 ? 'text-green-600' : 'text-purple-700'}>
          {Math.abs(diff) < 0.5 ? 'Markt geräumt' : diff > 0
            ? <>Angebotsüberschuss <b className="num-input">{fmt(diff)}</b></>
            : <>Nachfrageüberschuss <b className="num-input">{fmt(-diff)}</b></>}
        </span>
      </div>
    </div>
  );
}

/* ---------- 1 · Markt wählen ---------- */
function Marktwahl({ scKey, onWahl }) {
  return (
    <div>
      <p className="text-[12px] text-slate-500 mb-2">Wähle ein Gut aus:</p>
      <div className="grid grid-cols-3 gap-1.5">
        {SCENARIOS.map(s => {
          const aktiv = s.key === scKey;
          return (
            <button key={s.key} onClick={() => onWahl(s.key)}
              className={`produktkarte relative rounded-lg border-2 p-1.5 flex flex-col items-center gap-1 ${aktiv
                ? 'border-amber-400 bg-amber-50 shadow-inner' : 'border-[#EAE2D2] bg-[#FBF8F1] hover:border-blue-300'}`}>

              {aktiv && <span className="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-green-500 text-white text-[9px] flex items-center justify-center">✓</span>}
              <Pixel name={s.sprite} size={2.2} title={s.name} />
              <span className="text-[10px] font-semibold text-slate-700 leading-none text-center">{s.kurz}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ---------- 2 · Parameter festlegen ---------- */
function ParameterPanel({ sc, werte, setWert, pMax, onReset }) {
  const schritt = preisSchritt(pMax);
  return (
    <div>
      {/* Preis des Gutes: Bewegung AUF der Kurve */}
      <div className="pb-2 mb-2 border-b border-slate-200">
        <div className="flex items-center justify-between gap-2 mb-0.5">
          <span className="text-[12px] text-slate-700 flex items-center gap-1.5">
            <Pixel name="muenze" size={1.8} />Preis des Gutes (P)
          </span>
          <span className="text-[12.5px] font-bold num-input text-slate-800 whitespace-nowrap">{geld(werte.preis, sc)}</span>
        </div>
        <input type="range" className="neutral" min="0" max={Math.round(pMax)} step={schritt}
               value={werte.preis} onChange={e => setWert('preis', Number(e.target.value))} />
        <div className="text-[10.5px] text-amber-700 font-semibold">
          bewegt den Punkt <b>auf</b> der Kurve – die Kurven verschieben sich dadurch nicht
        </div>
      </div>

      {sc.parameter.map(par => {
        const v = werte[par.key];
        const ab = v - par.basis;
        const richtung = ab === 0 ? null : (ab > 0) === (par.k > 0) ? 'rechts' : 'links';
        return (
          <div key={par.key} className="py-1.5">
            <div className="flex items-start justify-between gap-2 mb-0.5">
              <span className="text-[12px] text-slate-700 flex items-start gap-1.5 leading-tight">
                <span className="mt-0.5 shrink-0"><Pixel name={PAR_SPRITE[par.key]} size={1.8} /></span>
                <span title={par.hilfe}>{par.label}</span>
              </span>
              <span className="text-[12.5px] font-bold num-input text-slate-800 whitespace-nowrap">
                {par.einheit === '%' ? fmt(v) + ' %' : fmt(v, par.step < 1 ? 2 : 0) + ' ' + par.einheit}
              </span>
            </div>
            <input type="range" min={par.min} max={par.max} step={par.step} value={v}
                   onChange={e => setWert(par.key, Number(e.target.value))} />
            {richtung && (
              <div className="text-[10.5px] font-semibold text-blue-600">
                → Nachfragekurve verschiebt sich nach {richtung} ({richtung === 'rechts' ? 'Nachfrage steigt' : 'Nachfrage sinkt'})
              </div>
            )}
          </div>
        );
      })}

      <button onClick={onReset}
        className="knopf mt-2 w-full py-2 rounded-lg border-2 border-slate-300 bg-white text-[12px] font-semibold text-slate-600 flex items-center justify-center gap-1.5">
        ⟳ Zurücksetzen
      </button>
    </div>
  );
}

/* ---------- 3b · Aktuelle Marktlage ---------- */
function Marktlage({ sc, markt, preis }) {
  const k = marktKennzahlen(markt);
  const n = qd(markt, preis), a = qs(markt, preis), diff = a - n;
  const Zeile = ({ l, v, farbe = 'text-slate-800', stark }) => (
    <div className="flex items-baseline justify-between gap-2 py-[3px] border-b border-dashed border-slate-200 last:border-0">
      <span className="text-[11px] text-slate-500 leading-tight min-w-0">{l}</span>
      <span className={`num-input whitespace-nowrap shrink-0 ${stark ? 'text-[13.5px] font-bold' : 'text-[12.5px] font-semibold'} ${farbe}`}>{v}</span>
    </div>
  );
  return (
    <div>
      <Zeile l={'Gleichgewichts\u00ADpreis'} v={geld(k.P, sc)} farbe="text-amber-600" stark />
      <Zeile l={'Gleichgewichts\u00ADmenge'} v={`${fmt(k.Q)} ${sc.qUnit}`} farbe="text-amber-600" stark />
      <Zeile l={`Nachfrage bei ${geld(preis, sc)}`} v={`${fmt(Math.max(0, n))} ${sc.qUnit}`} farbe="text-blue-600" />
      <Zeile l={`Angebot bei ${geld(preis, sc)}`} v={`${fmt(Math.max(0, a))} ${sc.qUnit}`} farbe="text-red-600" />
      <Zeile l={Math.abs(diff) < 0.5 ? 'Markt geräumt' : diff > 0 ? 'Angebotsüberschuss' : 'Nachfrageüberschuss'}
             v={Math.abs(diff) < 0.5 ? '0' : fmt(Math.abs(diff))}
             farbe={Math.abs(diff) < 0.5 ? 'text-green-600' : 'text-purple-700'} />
      <Zeile l={'Konsumenten\u00ADrente'} v={geld(k.KR, sc)} farbe="text-green-700" />
      <Zeile l={'Produzenten\u00ADrente'} v={geld(k.PR, sc)} farbe="text-red-600" />
      <Zeile l={'Gesamt\u00ADwohlfahrt'} v={geld(k.W, sc)} />
      <Zeile l={'Prohibitiv\u00ADpreis'} v={geld(k.pMaxD, sc)} />
      <Zeile l={'Mindest\u00ADangebotspreis'} v={geld(k.pMinS, sc)} />
    </div>
  );
}

/* ---------- 4 · Aufgaben (Mission) ---------- */
function MissionPanel({ mission, ctx, onAntwort, onPruefen, onWeiter, onTipp, onNeu, fertig }) {
  if (!mission) return null;
  const n = mission.aufgaben.length;

  if (mission.aktiv >= n) {
    const punkte = mission.ergebnisse.reduce((s, e) => s + e.punkte, 0);
    const max = mission.ergebnisse.reduce((s, e) => s + e.max, 0);
    return (
      <div className="text-center py-3">
        <div className="text-4xl mb-1">{punkte >= max * 0.8 ? '🏆' : '💪'}</div>
        <div className="text-lg font-bold text-slate-800">{punkte} von {max} Punkten</div>
        <p className="text-[12.5px] text-slate-500 mt-1">Mission abgeschlossen. Wähle ein anderes Gut oder starte eine neue Mission.</p>
        <button onClick={onNeu} className="knopf mt-3 w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-[13px]">
          🔁 Neue Mission
        </button>
      </div>
    );
  }

  const auf = mission.aufgaben[mission.aktiv];
  const schritt = auf.schritte[mission.schritt];
  const pre = `${mission.aktiv}.${mission.schritt}.`;
  const res = mission.res;
  const erledigt = res && (res.ok || mission.versuch >= 2);
  const par = schritt.art === 'regler' ? ctx.sc.parameter.find(p => p.key === schritt.parameter) : null;

  // Live-Rückmeldung für Simulations- und Experimentierschritte
  let liveOk = null;
  if (schritt.art === 'regler') liveOk = Math.abs(ctx.werte[schritt.parameter] - schritt.ziel) <= par.step * 0.51;
  if (schritt.art === 'bedingung') liveOk = marktKennzahlen(ctx.simMarkt).Q >= schritt.ziel - 0.5;

  return (
    <div>
      <div className="flex items-center justify-between gap-2">
        <span className="text-[12px] font-bold text-slate-700">Aufgabe {mission.aktiv + 1} von {n}</span>
        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 border border-blue-200 text-blue-700">
          {schritt.phase || auf.phase}
        </span>
      </div>
      <h3 className="text-[13.5px] font-bold text-slate-800 mt-0.5">{auf.titel}</h3>

      {mission.schritt === 0 && auf.einleitung && (
        <p className="text-[12.5px] text-slate-600 leading-snug mt-1">{auf.einleitung}</p>
      )}
      {auf.zeigFunktionen && <>
        <FunktionsBox m={mission.uebung} />
        <p className="text-[11px] text-slate-400 leading-snug -mt-1 mb-1">
          Reine Rechenaufgabe: Diese Zahlen gehören zur Aufgabe, nicht zur Simulation links.
        </p>
      </>}

      {/* bereits erledigte Schritte */}
      {auf.schritte.slice(0, mission.schritt).map((s, i) => (
        <div key={i} className="mt-1.5 text-[11.5px] text-green-700 bg-green-50 border border-green-200 rounded px-2 py-1 leading-snug">
          ✓ {s.phase ? s.phase.split('·').pop().trim() + ': ' : ''}erledigt
        </div>
      ))}

      <p className="text-[13px] text-slate-700 leading-snug mt-2 font-medium">{schritt.text}</p>

      {/* Auswahlfrage */}
      {schritt.art === 'wahl' && (
        <div className="space-y-1.5 mt-2">
          {schritt.optionen.map((o, i) => {
            const gewaehlt = mission.antworten[pre + 'wahl'] === i;
            let stil = 'border-slate-200 bg-white';
            if (erledigt && i === schritt.richtig) stil = 'border-green-500 bg-green-50';
            else if (res && !res.ok && gewaehlt) stil = 'border-red-400 bg-red-50';
            else if (gewaehlt) stil = 'border-blue-500 bg-blue-50 ring-2 ring-blue-200';
            return (
              <button key={i} disabled={erledigt} onClick={() => onAntwort(pre + 'wahl', i)}
                className={`w-full text-left text-[12.5px] leading-snug px-2.5 py-1.5 rounded-lg border-2 ${stil}`}>
                <span className="font-bold mr-1">{String.fromCharCode(65 + i)})</span>{o}
              </button>
            );
          })}
        </div>
      )}

      {/* Rechen- oder Ablesefelder */}
      {(schritt.art === 'rechnen' || schritt.art === 'ablesen') && (
        <div className="space-y-1.5 mt-2">
          {schritt.felder.map(f => {
            const st = res && res.feld ? res.feld[f.key] : null;
            return (
              <div key={f.key} className="flex items-center gap-2">
                <span className="text-[12px] text-slate-600 flex-1 leading-tight">{f.label}</span>
                <input type="text" inputMode="decimal" disabled={erledigt}
                  value={mission.antworten[pre + f.key] || ''}
                  onChange={e => onAntwort(pre + f.key, e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter' && !erledigt) onPruefen(); }}
                  className={`num-input w-24 px-2 py-1.5 rounded-lg border-2 text-[14px] font-semibold text-right
                    ${st && st.ok ? 'border-green-500 bg-green-50 text-green-800'
                      : st && !st.ok ? 'border-red-400 bg-red-50 text-red-700'
                      : 'border-slate-300 bg-white focus:border-blue-500 focus:outline-none'}`} />
                <span className="text-[11px] text-slate-500 w-14 shrink-0">{f.unit}</span>
              </div>
            );
          })}
          {res && !res.ok && res.feld && schritt.felder.some(f => res.feld[f.key] && !res.feld[f.key].ok) && mission.versuch >= 2 && (
            <div className="text-[11.5px] text-red-600">
              richtig: {schritt.felder.map(f => `${f.label} ${fmt(res.feld[f.key].soll, f.dec)}`).join(' · ')}
            </div>
          )}
        </div>
      )}

      {/* Simulations- und Experimentierschritt */}
      {(schritt.art === 'regler' || schritt.art === 'bedingung') && (
        <div className={`mt-2 rounded-lg border-2 px-2.5 py-2 text-[12px] font-semibold ${liveOk
          ? 'border-green-500 bg-green-50 text-green-800' : 'border-amber-300 bg-amber-50 text-amber-900'}`}>
          {liveOk ? '✓ Einstellung erreicht – jetzt prüfen.' : 'Noch nicht erreicht. Stelle den Regler links im Bereich 2 ein.'}
          {schritt.art === 'bedingung' && (
            <div className="font-normal mt-0.5">
              aktuelle Gleichgewichtsmenge: {fmt(marktKennzahlen(ctx.simMarkt).Q)} {ctx.sc.qUnit} · Ziel: ≥ {fmt(schritt.ziel)}
            </div>
          )}
        </div>
      )}

      {/* Notiz */}
      {schritt.art === 'notiz' && (
        <div className="mt-2">
          <textarea rows="3" value={mission.antworten[pre + 'notiz'] || ''}
            onChange={e => onAntwort(pre + 'notiz', e.target.value)}
            placeholder="Deine Begründung …"
            className="w-full px-2 py-1.5 rounded-lg border-2 border-slate-300 focus:border-blue-500 focus:outline-none text-[12.5px]" />
          {erledigt && (
            <div className="mt-1.5 rounded-lg bg-slate-50 border border-slate-200 p-2 text-[12px] text-slate-700 leading-snug">
              <b>Musterlösung:</b> {schritt.muster}
            </div>
          )}
        </div>
      )}

      {/* Rückmeldung */}
      {res && (
        <div className={`mt-2 rounded-lg border-2 px-2.5 py-1.5 text-[12.5px] font-semibold pop ${res.ok
          ? 'border-green-500 bg-green-50 text-green-800' : 'border-red-400 bg-red-50 text-red-800'}`}>
          {res.ok ? '✅ Richtig!' : mission.versuch >= 2 ? '❌ Leider nicht richtig.' : '⚠️ Noch nicht richtig – versuch es noch einmal.'}
          {res.ok && schritt.erklaerung && <div className="font-normal mt-1">{schritt.erklaerung}</div>}
        </div>
      )}
      {mission.zeigLoesung && schritt.loesung && (
        <ol className="mt-2 space-y-1 rounded-lg bg-slate-50 border border-slate-200 p-2">
          {schritt.loesung.map((z, i) => <li key={i} className="text-[11.5px] font-mono text-slate-700 leading-relaxed">{i + 1}. {z}</li>)}
        </ol>
      )}
      {mission.tippAn && schritt.tipp && <div className="mt-2"><Maskottchen figur="🧑‍🏫" text={schritt.tipp} /></div>}

      <div className="flex gap-2 mt-2.5">
        {!erledigt ? (
          <>
            <button onClick={onPruefen}
              className="knopf flex-1 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-[13px]">
              Lösung prüfen
            </button>
            {schritt.tipp && !mission.tippAn && (
              <button onClick={onTipp} className="knopf px-3 rounded-xl border-2 border-amber-300 bg-amber-50 text-amber-700 font-bold text-[13px]">💡</button>
            )}
          </>
        ) : (
          <button onClick={onWeiter}
            className="knopf flex-1 py-2.5 rounded-xl bg-green-600 text-white font-bold text-[13px]">
            {mission.schritt + 1 < auf.schritte.length ? 'Weiter →'
              : mission.aktiv + 1 < n ? 'Nächste Aufgabe →' : 'Mission abschließen 🏆'}
          </button>
        )}
      </div>

      <div className="flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-slate-200 text-[11px]">
        <span className="text-slate-500 font-semibold">BELOHNUNG</span>
        <span className="flex items-center gap-1 font-bold text-amber-600"><Pixel name="stern" size={1.6} /> +20</span>
        <span className="flex items-center gap-1 font-bold text-green-600">XP +50</span>
      </div>
    </div>
  );
}

/* ---------- 5 · Tiefer gehen ---------- */
const ANALYSE_TABS = [
  { key:'preis', label:'Preisänderung', par:'preis', braucht:'gleichgewicht',
    frage:'Was passiert, wenn sich der Preis des Gutes selbst ändert?',
    fazit:'Eine Änderung des Güterpreises verschiebt die Kurven nicht. Man bewegt sich nur auf der Nachfrage- bzw. Angebotskurve: Die nachgefragte Menge ändert sich, Gleichgewichtspreis und -menge bleiben gleich. Erst ein Nichtpreisfaktor verschiebt die ganze Kurve.' },
  { key:'einkommen', label:'Einkommensänderung', par:'einkommen', braucht:'einkommen',
    frage:'Was passiert, wenn sich das Einkommen der Konsumenten ändert?',
    fazit:'Bei einem normalen Gut verschiebt ein höheres Einkommen die Nachfragekurve nach rechts: Gleichgewichtspreis und Gleichgewichtsmenge steigen. Bei einem inferioren Gut wäre die Richtung umgekehrt.' },
  { key:'komplement', label:'Komplementärgut', par:'komplement', braucht:'komplement',
    frage:'Was passiert, wenn sich der Preis des Komplementärgutes ändert?',
    fazit:'Ein höherer Preis des Komplementärgutes verteuert das gemeinsam genutzte Paket. Die Nachfrage sinkt bei jedem Preis, die Nachfragekurve verschiebt sich nach links – Gleichgewichtspreis und -menge sinken.' },
  { key:'substitut', label:'Substitutionsgut', par:'substitut', braucht:null,
    frage:'Was passiert, wenn sich der Preis des Substitutionsgutes ändert?',
    fazit:'Wird das Ersatzgut teurer, weichen Konsumenten auf das betrachtete Gut aus. Die Nachfragekurve verschiebt sich nach rechts – Gleichgewichtspreis und -menge steigen.' },
  { key:'erwartung', label:'Erwartungen', par:'erwartung', braucht:null,
    frage:'Was passiert, wenn die Konsumenten künftig höhere Preise erwarten?',
    fazit:'Wer künftig steigende Preise erwartet, zieht Käufe in die Gegenwart vor. Die heutige Nachfragekurve verschiebt sich nach rechts – Gleichgewichtspreis und -menge steigen heute.' },
];

const Pfeil = ({ d }) => d > 0.0001 ? <span className="text-green-600 font-bold">↑</span>
  : d < -0.0001 ? <span className="text-red-600 font-bold">↓</span>
  : <span className="text-slate-400">→</span>;

function AnalysePanel({ sc, basis, werte, setWert, tab, setTab, geloest, pMax }) {
  const t = ANALYSE_TABS.find(x => x.key === tab) || ANALYSE_TABS[0];
  const par = t.par === 'preis' ? null : sc.parameter.find(p => p.key === t.par);
  const start = startParameter(sc, basis);

  // Für den Vergleich wird ausschließlich der Faktor dieses Reiters verändert
  const nachherWerte = { ...start, [t.par]: werte[t.par] };
  const vorherMarkt = simulierterMarkt(sc, basis, start);
  const nachherMarkt = simulierterMarkt(sc, basis, nachherWerte);
  const vP = start.preis;
  const nP = t.par === 'preis' ? werte.preis : start.preis;
  const kv = marktKennzahlen(vorherMarkt), kn = marktKennzahlen(nachherMarkt);
  const preisModus = t.par === 'preis';

  const zeilen = preisModus
    ? [
        ['Nachgefragte Menge', qd(nachherMarkt, nP) - qd(vorherMarkt, vP), `${fmt(Math.max(0, qd(nachherMarkt, nP)))} ${sc.qUnit}`],
        ['Angebotene Menge', qs(nachherMarkt, nP) - qs(vorherMarkt, vP), `${fmt(Math.max(0, qs(nachherMarkt, nP)))} ${sc.qUnit}`],
        ['Gleichgewichts\u00ADpreis', kn.P - kv.P, geld(kn.P, sc)],
        ['Gleichgewichts\u00ADmenge', kn.Q - kv.Q, `${fmt(kn.Q)} ${sc.qUnit}`],
      ]
    : [
        ['Gleichgewichts\u00ADpreis', kn.P - kv.P, geld(kn.P, sc)],
        ['Gleichgewichts\u00ADmenge', kn.Q - kv.Q, `${fmt(kn.Q)} ${sc.qUnit}`],
        ['Konsumenten\u00ADrente', kn.KR - kv.KR, geld(kn.KR, sc)],
        ['Produzenten\u00ADrente', kn.PR - kv.PR, geld(kn.PR, sc)],
      ];

  const frei = t.braucht ? geloest.includes(t.braucht) : geloest.length >= 2;

  return (
    <div>
      <div className="flex gap-1 overflow-x-auto pb-2 -mx-1 px-1">
        {ANALYSE_TABS.map(x => (
          <button key={x.key} onClick={() => setTab(x.key)}
            className={`shrink-0 px-2.5 py-1.5 rounded-lg text-[11.5px] font-semibold border ${x.key === tab
              ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
            {x.label}
          </button>
        ))}
      </div>

      <div className="grid gap-3 grid-cols-1 lg:grid-cols-[190px_minmax(0,1fr)_212px]">
        <div>

          <p className="text-[11.5px] text-slate-500 leading-snug mt-1">
            Verschiebe den Regler und beobachte die Auswirkungen auf Nachfrage, Gleichgewicht und Renten.
            Für diesen Vergleich wird <b>nur dieser eine Faktor</b> verändert (ceteris paribus).

          <div className="mt-2 rounded-lg border border-slate-200 p-2">

                  : (par.einheit === '%' ? fmt(werte[par.key]) + ' %' : fmt(werte[par.key], par.step < 1 ? 2 : 0) + ' ' + par.einheit)}

            <input type="range"
              className={preisModus ? 'neutral' : ''}

              step={preisModus ? preisSchritt(pMax) : par.step}

              onChange={e => setWert(preisModus ? 'preis' : par.key, Number(e.target.value))} />
            <div className="flex justify-between text-[10px] text-slate-400">
              <span>{preisModus ? '0' : fmt(par.min, par.step < 1 ? 2 : 0)}</span>
              <span>{preisModus ? fmt(Math.round(pMax)) : fmt(par.max, par.step < 1 ? 2 : 0)}</span>

        <div className="grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-1 items-center">

            <div className="text-center text-[11px] text-slate-600 mb-0.5">
              P* = {geld(kv.P, sc)} · Q* = {fmt(kv.Q)}

            <MarktChart m={vorherMarkt} sc={sc} mini showSurplus showEq priceLine={preisModus ? vP : undefined} />

          <div className="text-2xl text-green-600 font-bold text-center">
            <span className="sm:hidden">↓</span><span className="hidden sm:inline">→</span>

          <div>
            <div className="text-center text-[10.5px] font-bold text-slate-500 uppercase tracking-wider">Nachher</div>
            <div className="text-center text-[11px] text-slate-600 mb-0.5">
              P* = {geld(kn.P, sc)} · Q* = {fmt(kn.Q)}
            </div>
            <MarktChart m={nachherMarkt} sc={sc} mini showSurplus showEq
                        compare={preisModus ? undefined : vorherMarkt} priceLine={preisModus ? nP : undefined} />

        </div>

        <div>
          <div className="cap mb-1">Änderungen</div>
          {zeilen.map(([l, d, v], i) => (
            <div key={i} className="flex items-center justify-between gap-1 py-1 border-b border-dashed border-slate-200 last:border-0">
              <span className="text-[11px] text-slate-500 leading-tight min-w-0">{l}</span>
              <span className="text-[11.5px] font-semibold num-input whitespace-nowrap shrink-0"><Pfeil d={d} /> {v}</span>
            </div>
          ))}
          <div className={`mt-2 rounded-lg border p-2 text-[11.5px] leading-snug ${frei
            ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
            <b>{frei ? '💡 Fazit' : '🔒 Fazit'}</b><br />

  );
}

                <td className="py-1.5 px-2 text-right num-input text-slate-500 whitespace-nowrap">{z.e ? z.e.richtig : '–'}</td>
                <td className={`py-1.5 pl-2 text-right num-input font-bold whitespace-nowrap ${z.e ? (z.e.punkte === z.e.max ? 'text-green-600' : 'text-amber-600') : 'text-slate-400'}`}>

      <div className="cap mt-3 mb-1">Verlauf gespeicherter Marktlagen</div>

          <div key={i} className="shrink-0 w-[128px] rounded-lg border border-slate-200 p-1">
            <MarktChart m={v.markt} sc={scById(v.scKey)} mini showSurplus showEq />
            <div className="text-[9.5px] text-slate-500 text-center leading-tight mt-0.5">
              {v.zeit} · {scById(v.scKey).kurz}<br />P*={fmt(v.P, v.P < 100 ? 2 : 0)} Q*={fmt(v.Q)}

        <button onClick={onSpeichern}
          className="knopf shrink-0 w-[128px] rounded-lg bg-violet-600 text-white text-[12px] font-bold uppercase tracking-wide flex flex-col items-center justify-center gap-1 py-4">
          <span className="text-xl leading-none">+</span>Speichern

      {verlauf.length > 0 && (
        <p className="text-[10.5px] text-slate-400 mt-1">
          So kannst du verschiedene Marktsituationen nebeneinander vergleichen.

/* ============================================================
   14. HAUPTKOMPONENTE
   ============================================================ */
function App() {
  const [p, setP] = useState(loadProgress);
  useEffect(() => saveProgress(p), [p]);
  const kompakt = useKompakt();
  const [ansicht, setAnsicht] = useState('simulator');
  const [trainTab, setTrainTab] = useState('uebung');
  const [toast, setToast] = useState(null);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 1800); return () => clearTimeout(id); }, [toast]);

  /* ---------- Simulator ---------- */
  const start = useRef(null);
  if (!start.current) { const s = SCENARIOS[0]; start.current = { s, m: makeMarket(s) }; }
  const [scKey, setScKey] = useState(start.current.s.key);
  const [basis, setBasis] = useState(() => start.current.m);
  const [werte, setWerte] = useState(() => startParameter(start.current.s, start.current.m));
  const [mission, setMission] = useState(() => macheMission(start.current.s, start.current.m));
  const [analyseTab, setAnalyseTab] = useState('preis');

  const sc = scById(scKey);
  const simMarkt = useMemo(() => simulierterMarkt(sc, basis, werte), [sc, basis, werte]);
  const verschoben = Math.abs(nachfrageFaktor(sc, werte) - 1) > 0.0005;
  const pMax = Math.max(prohibitiv(simMarkt), prohibitiv(basis));

  const setWert = (k, v) => setWerte(o => ({ ...o, [k]: v }));
  const reglerReset = () => setWerte(startParameter(sc, basis));

  const produktWechsel = (key) => {
    const s2 = scById(key), m2 = makeMarket(s2);
    setScKey(key); setBasis(m2); setWerte(startParameter(s2, m2)); setMission(macheMission(s2, m2));
    setAnalyseTab('preis');
  };
  const neueMission = () => setMission(macheMission(sc, basis));

  /* ---------- Missionsablauf ---------- */
  const missionAntwort = (k, v) => setMission(mi => ({ ...mi, antworten: { ...mi.antworten, [k]: v } }));

  const missionPruefen = () => {
    const mi = { ...mission };
    const auf = mi.aufgaben[mi.aktiv], schritt = auf.schritte[mi.schritt];
    const r = pruefeSchritt(schritt, mi.antworten, `${mi.aktiv}.${mi.schritt}.`, { sc, basis, simMarkt, werte });
    mi.versuch = mi.versuch + 1;
    mi.res = r;
    if (!r.ok && mi.versuch >= 2) mi.zeigLoesung = true;
    mi.schrittErg = { ...(mi.schrittErg || {}), [`${mi.aktiv}.${mi.schritt}`]: { ...r, versuch: mi.versuch } };
    setMission(mi);
  };

  const missionWeiter = () => {
    const mi = { ...mission };
    const auf = mi.aufgaben[mi.aktiv];
    if (mi.schritt + 1 < auf.schritte.length) {
      mi.schritt += 1; mi.versuch = 0; mi.res = null; mi.zeigLoesung = false; mi.tippAn = false;
    } else {
      const bewertet = auf.schritte.map((s, i) => ({ s, i })).filter(x => GRADED.includes(x.s.art));
      let anteil = 0; const deine = [], richtig = [];
      for (const { i } of bewertet) {
        const e = (mi.schrittErg || {})[`${mi.aktiv}.${i}`];
        if (e) {
          anteil += e.ok ? (e.versuch <= 1 ? 1 : 0.6) : 0;
          const art = auf.schritte[i].art;
          if (e.deine && (art === 'rechnen' || art === 'ablesen')) { deine.push(e.deine); richtig.push(e.richtig); }
        }
      }
      const max = 20, punkte = Math.round(max * (bewertet.length ? anteil / bewertet.length : 1));
      mi.ergebnisse = [...mi.ergebnisse, { id: auf.id, punkte, max,
        deine: deine.join(' · ') || '✓', richtig: richtig.join(' · ') || '✓' }];
      mi.aktiv += 1; mi.schritt = 0; mi.versuch = 0; mi.res = null; mi.zeigLoesung = false; mi.tippAn = false;
      const naechste = mi.aufgaben[mi.aktiv];
      if (naechste && naechste.resetVorher) setWerte(startParameter(sc, basis));
      const xp = Math.round(punkte * 2.5);
      setP(pr => ({ ...pr, coins: pr.coins + punkte, xp: pr.xp + xp,
        missionAufgaben: (pr.missionAufgaben || 0) + 1,
        missionPunkte: (pr.missionPunkte || 0) + punkte,
        missionen: (pr.missionen || 0) + (mi.aktiv >= mi.aufgaben.length ? 1 : 0) }));
      setToast(`+${punkte} 🪙  +${xp} XP`);
    }
    setMission(mi);
  };

  /* ---------- Verlauf gespeicherter Marktlagen ---------- */
  const speichern = () => {
    const k = marktKennzahlen(simMarkt);
    const eintrag = { zeit: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }),
      scKey, markt: { a: simMarkt.a, b: simMarkt.b, c: simMarkt.c, d: simMarkt.d }, P: k.P, Q: k.Q };
    setP(pr => ({ ...pr, verlauf: [...(pr.verlauf || []), eintrag].slice(-6) }));
    setToast('Marktlage gespeichert');
  };

  /* ---------- Übungsrunden (bestehende Niveaustufen) ---------- */
  const RUNDE_LAENGE = 5;
  const [stufe, setStufe] = useState(1);
  const [runde, setRunde] = useState(() => makeRunde(1, RUNDE_LAENGE));
  const [idx, setIdx] = useState(0);
  const [erg, setErg] = useState([]);
  const [ant, setAnt] = useState({});
  const [versuch, setVersuch] = useState(0);
  const [res, setRes] = useState(null);
  const [zeigLoesung, setZeigLoesung] = useState(false);
  const [tippAn, setTippAn] = useState(false);
  const task = idx < runde.length ? runde[idx] : null;
  const rundeFertig = idx >= runde.length;
  const setAnswer = (k, v) => setAnt(a => ({ ...a, [k]: v }));
  const resetFeld = () => { setAnt({}); setVersuch(0); setRes(null); setZeigLoesung(false); setTippAn(false); };
  const neueRunde = (s) => { setStufe(s); setRunde(makeRunde(s, RUNDE_LAENGE)); setIdx(0); setErg([]); resetFeld(); setTrainTab('uebung'); };

  const pruefen = () => {
    const t = task; if (!t) return;
    const fr = {}; let ok = true;
    t.fields.forEach(f => {
      const v = parseNum(ant[f.key] || '');
      const gut = isFinite(v) && Math.abs(v - f.correct) <= f.tol;
      fr[f.key] = gut; if (!gut) ok = false;
    });
    (t.choices || []).forEach(c => { const gut = ant[c.key] === c.correct; fr[c.key] = gut; if (!gut) ok = false; });
    if (ok) {
      const coins = versuch === 0 ? t.reward : Math.round(t.reward * 0.6);
      setRes({ ok: true, fr, fertig: true, coins });
      setErg(e => { const n = [...e]; n[idx] = versuch === 0 ? 'ok' : 'ok2'; return n; });
      setP(pr => {
        const streak = pr.streak + 1;
        return { ...pr, coins: pr.coins + coins, xp: pr.xp + coins, totalT: pr.totalT + 1, totalOk: pr.totalOk + 1,
          streak, bestStreak: Math.max(pr.bestStreak, streak),
          stats: { ...pr.stats, [t.stufe]: { t: pr.stats[t.stufe].t + 1, ok: pr.stats[t.stufe].ok + 1 } } };
      });
      setToast(`+${coins} 🪙`);
    } else if (versuch === 0) { setRes({ ok: false, fr, fertig: false }); setVersuch(1); }
    else {
      setRes({ ok: false, fr, fertig: true, coins: 0 });
      setErg(e => { const n = [...e]; n[idx] = 'fail'; return n; });
      setZeigLoesung(true);
      setP(pr => ({ ...pr, totalT: pr.totalT + 1, streak: 0,
        stats: { ...pr.stats, [t.stufe]: { t: pr.stats[t.stufe].t + 1, ok: pr.stats[t.stufe].ok } } }));
    }
  };
  const weiter = () => { setIdx(i => i + 1); resetFeld(); };

  /* ---------- Marktabenteuer ---------- */
  const [spiel, setSpiel] = useState(null);
  const spielStarten = (k) => { setSpiel(neuesSpiel(k)); setTrainTab('spiel'); };
  const spielAendern = (fn) => setSpiel(alt => { const g = { ...alt }; fn(g); return g; });
  const spielPruefeMC = () => {
    const g = { ...spiel, mcGeprueft: true };
    if (g.mcAntwort === g.ereignis.richtig) { setP(pr => ({ ...pr, coins: pr.coins + 5, xp: pr.xp + 5 })); setToast('+5 🪙'); }
    setSpiel(g);
  };
  const spielVerkaufen = () => {
    const g = { ...spiel };
    const absatz = absatzBei(g, g.preis);
    const umsatz = g.preis * absatz, varKosten = g.stueckkosten * absatz;
    const db = umsatz - varKosten, gewinn = db - g.fixkosten;
    const best = besterPreis(g);
    const quote = best.gewinn > 0 ? gewinn / best.gewinn : (gewinn >= 0 ? 1 : 0);
    const sterne = gewinn <= 0 ? 0 : quote >= 0.9 ? 3 : quote >= 0.7 ? 2 : quote >= 0.45 ? 1 : 0;
    const eingabe = parseNum(g.schaetzung || '');
    let schaetzungOk = false, schaetzungText = '';
    if (isFinite(eingabe)) {
      schaetzungOk = Math.abs(eingabe - gewinn) <= Math.max(50, Math.abs(gewinn) * 0.02);
      const rechnung = `(${fmt(g.preis, 2)} − ${fmt(g.stueckkosten, 2)}) · ${fmt(absatz)} − ${fmt(g.fixkosten)}`;
      schaetzungText = schaetzungOk
        ? `✅ Deine Gewinnrechnung stimmt: ${rechnung} = ${eur(gewinn)}. +10 Münzen`
        : `Deine Schätzung lag bei ${eur(eingabe)}, richtig wären ${eur(gewinn)}: ${rechnung}.`;
    }
    const muenzen = sterne * 5 + (schaetzungOk ? 10 : 0);
    g.ergebnis = { preis: g.preis, absatz, umsatz, varKosten, db, gewinn, sterne,
      bestPreis: best.preis, bestGewinn: best.gewinn, schaetzungOk, schaetzungText, muenzen };
    g.konto += gewinn; g.sterneGesamt += sterne;
    g.verlauf = [...g.verlauf, { runde: g.runde, emoji: g.ereignis.emoji, titel: g.ereignis.titel, preis: g.preis, absatz, gewinn, sterne }];
    g.phase = 'ergebnis';
    if (muenzen > 0) { setP(pr => ({ ...pr, coins: pr.coins + muenzen, xp: pr.xp + muenzen })); setToast(`+${muenzen} 🪙`); }
    setSpiel(g);
  };
  const spielNaechste = () => {
    const g = { ...spiel };
    const ziel = g.preis < g.konkurrenz ? g.konkurrenz * 0.94 : g.konkurrenz * 1.04;
    g.konkurrenz = Math.max(Math.round(g.stueckkosten * 1.1), Math.round(ziel));
    if (g.runde >= SPIEL_RUNDEN) {
      g.phase = 'ende';
      setP(pr => ({ ...pr, spielPartien: (pr.spielPartien || 0) + 1, spielBest: Math.max(pr.spielBest || 0, Math.round(g.konto)) }));
    } else { g.runde += 1; g.phase = 'karte'; ziehEreignis(g); }
    setSpiel(g);
  };

  const lvl = levelOf(p.xp);
  const geloest = mission ? mission.ergebnisse.map(e => e.id) : [];

  /* ---------- Darstellung ---------- */
  const Chip = ({ sprite, wert, farbe }) => (
    <span className={`hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-[12px] font-bold ${farbe}`}>
      <Pixel name={sprite} size={1.8} />{wert}
    </span>
  );
  const IconBtn = ({ sprite, aktiv, onClick, titel }) => (
    <button onClick={onClick} title={titel} aria-label={titel}
      className={`w-9 h-9 rounded-lg border flex items-center justify-center shrink-0 transition ${aktiv
        ? 'bg-blue-600 border-blue-600' : 'bg-white border-[#DBE7F3] hover:bg-slate-50'}`}>
      <Pixel name={sprite} size={2.2} pal={aktiv ? { d:'#FFFFFF', p:'#FFFFFF', z:'#FFFFFF' } : undefined} />
    </button>
  );

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#DBE7F3]">
        <div className="max-w-[1600px] mx-auto px-2 sm:px-3 py-2 flex items-center gap-2 sm:gap-3">
          <div className="w-9 h-9 rounded-lg bg-blue-50 border border-blue-200 flex items-center justify-center shrink-0">
            <Pixel name="diagramm" size={3} />
          </div>
          <div className="min-w-0 flex-1">
            <h1 className="pixel text-[13px] sm:text-[17px] font-bold uppercase text-blue-800 leading-none truncate">
              Marktnachfrage-Simulator
            </h1>
            <p className="hidden sm:block text-[11px] text-slate-500 leading-tight mt-1">
              Verstehe Märkte. Analysiere Zusammenhänge. Löse Aufgaben.
            </p>
          </div>
          <Chip sprite="stern" wert={`Level ${lvl}`} farbe="bg-amber-50 border-amber-200 text-amber-700" />
          <Chip sprite="muenze" wert={fmt(p.coins)} farbe="bg-yellow-50 border-yellow-200 text-yellow-700" />
          <Chip sprite="herz" wert={`${p.totalT ? Math.round(p.totalOk / p.totalT * 100) : 100} %`} farbe="bg-rose-50 border-rose-200 text-rose-600" />
          <div className="flex gap-1.5">
            <IconBtn sprite="diagramm" titel="Simulator" aktiv={ansicht === 'simulator'} onClick={() => setAnsicht('simulator')} />
            <IconBtn sprite="pokal" titel="Trainingscenter" aktiv={ansicht === 'training'} onClick={() => setAnsicht('training')} />
            <IconBtn sprite="zahnrad" titel="Einstellungen" aktiv={ansicht === 'einstellungen'} onClick={() => setAnsicht('einstellungen')} />
          </div>
        </div>
      </header>

      {toast && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 pop px-4 py-2 rounded-full bg-green-600 text-white font-bold text-sm shadow-lg">
          {toast}
        </div>
      )}

      <main className="max-w-[1600px] mx-auto px-2 sm:px-3 py-3">
        {ansicht === 'simulator' && (
          <div className="grid gap-5 grid-cols-1 lg:grid-cols-12 items-start">
            <div className="contents lg:flex lg:flex-col lg:gap-5 lg:col-span-3 lg:col-start-1 lg:row-start-1">
              <Block nr="1" titel="Produkt auswählen" farbe="b-blau" className="order-1 lg:order-none">
                <Marktwahl scKey={scKey} onWahl={produktWechsel} />
              </Block>
              <Block titel="Marktteilnehmer" farbe="b-gruen" className="order-9 lg:order-none">
                <Marktteilnehmer />
              </Block>
            </div>

            <Block nr="3" titel="Nachfrage-Angebot-Visualisierung" farbe="b-lila"
              className="order-3 lg:order-none lg:col-span-6 lg:col-start-4 lg:row-start-1">
              <div className="flex items-center justify-center gap-2 mb-1">
                <Pixel name={sc.sprite} size={1.7} />
                <span className="pixel text-[13px] sm:text-[15px] font-bold text-slate-700">Markt für {sc.name}</span>
              </div>
              <MarktChart m={simMarkt} sc={sc} kompakt={kompakt} showSurplus showEq verschiebung
                          compare={verschoben ? basis : undefined} priceLine={werte.preis} gapLabel />
              <div className="mt-3 pt-3 border-t border-dashed border-slate-200">
                <div className="cap mb-2">Aktuelle Ergebnisse</div>
                <ErgebnisRaster sc={sc} markt={simMarkt} preis={werte.preis} />
              </div>
            </Block>

            <div className="contents lg:flex lg:flex-col lg:gap-5 lg:col-span-3 lg:col-start-10 lg:row-start-1">
            <Block nr="2" titel="Parameter ändern" farbe="b-blau" className="order-4 lg:order-none">
              <ParameterPanel sc={sc} werte={werte} setWert={setWert} pMax={pMax} onReset={reglerReset} />
              <div className="mt-2 pt-2 border-t border-dashed border-slate-200">
                <Maskottchen figur="🧑‍🏫" text={verschoben
                  ? 'Die gestrichelte Kurve zeigt die Ausgangslage. Ein Nichtpreisfaktor hat die ganze Nachfragekurve verschoben.'
                  : 'Bewege die Regler und beobachte, wie sich der Markt verändert. Löse danach die Aufgaben.'} />
              </div>
            </Block>

            <Block titel="Legende" farbe="b-lila" className="order-8 lg:order-none">
              <Legende />
            </Block>
            </div>

            <div className="contents lg:flex lg:flex-col lg:gap-5 lg:col-span-8 lg:col-start-1 lg:row-start-2">
              <Block titel="Die Marktwelt" farbe="b-gelb" innen="px-2 pb-2 pt-5"
                className="order-5 lg:order-none">
                <Marktwelt sc={sc} basis={basis} markt={simMarkt} preis={werte.preis} />
              </Block>
              <Block nr="5" titel="Tiefer gehen – analysiere den Markt" farbe="b-tuerkis"
                className="order-6 lg:order-none">
                <AnalysePanel sc={sc} basis={basis} werte={werte} setWert={setWert}
                  tab={analyseTab} setTab={setAnalyseTab} geloest={geloest} pMax={pMax} />
              </Block>
            </div>

            <div className="contents lg:flex lg:flex-col lg:gap-5 lg:col-span-4 lg:col-start-9 lg:row-start-2">
            <Block nr="4" titel="Aufgaben" farbe="b-gruen" className="order-2 lg:order-none">
              <MissionPanel mission={mission} ctx={{ sc, simMarkt, werte }}
                onAntwort={missionAntwort} onPruefen={missionPruefen} onWeiter={missionWeiter}
                onTipp={() => setMission(mi => ({ ...mi, tippAn: true }))} onNeu={neueMission} />
            </Block>

            <Block nr="6" titel="Deine Ergebnisse" farbe="b-gelb" className="order-7 lg:order-none">
              <ErgebnisPanel mission={mission} verlauf={p.verlauf || []} onSpeichern={speichern} sc={sc} />
            </Block>
            </div>
          </div>
        )}

        {ansicht === 'training' && (
          <div className="max-w-3xl mx-auto space-y-3">
            <div className="flex gap-1.5 overflow-x-auto pb-1">
              {[['uebung','📝 Übungsrunden'],['spiel','🏪 Marktabenteuer'],['theorie','📘 Theorie'],['fortschritt','🏆 Fortschritt']].map(([k, l]) => (
                <button key={k} onClick={() => setTrainTab(k)}
                  className={`shrink-0 px-3 py-2 rounded-lg text-[12.5px] font-semibold border ${trainTab === k
                    ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-[#DBE7F3]'}`}>{l}</button>
              ))}
            </div>

            {trainTab === 'uebung' && (
              <>
                <Block titel="Niveaustufe wählen">
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5">
                    {STUFEN.map(s => (
                      <button key={s.nr} onClick={() => neueRunde(s.nr)}
                        className={`text-left px-2.5 py-2 rounded-lg border-2 text-[12px] font-semibold ${stufe === s.nr
                          ? 'border-blue-500 bg-blue-50 text-blue-800' : 'border-slate-200 bg-white text-slate-600'}`}>
                        {s.emoji} Stufe {s.nr} – {s.kurz}
                      </button>
                    ))}
                    <button onClick={() => neueRunde(0)}
                      className={`text-left px-2.5 py-2 rounded-lg border-2 text-[12px] font-semibold ${stufe === 0
                        ? 'border-purple-500 bg-purple-50 text-purple-800' : 'border-slate-200 bg-white text-slate-600'}`}>
                      🎲 Gemischt
                    </button>
                  </div>
                  <div className="flex items-center gap-1.5 mt-2 text-[12px] text-slate-500">
                    Fortschritt:
                    {Array.from({ length: RUNDE_LAENGE }).map((_, i) => (
                      <span key={i} className={`w-3 h-3 rounded-full ${erg[i] === 'ok' ? 'bg-green-500'
                        : erg[i] === 'ok2' ? 'bg-yellow-400' : erg[i] === 'fail' ? 'bg-red-400'
                        : i === idx && !rundeFertig ? 'bg-blue-500' : 'bg-slate-200'}`}></span>
                    ))}
                  </div>
                </Block>
                {task && (
                  <Block titel={`Markt für ${task.sc.name}`} innen="p-2">
                    <MarktChart {...(() => {
                      const c = task.chart || {}, fertig = !!(res && res.fertig), neu = !!task.m2 && fertig;
                      return { m: neu ? task.m2 : task.m, compare: neu ? task.m : undefined, sc: task.sc,
                        showSurplus: !!c.showSurplus, showEq: c.showEq === false ? fertig : true,
                        points: fertig ? c.points : null, priceLine: c.priceLine, gapLabel: !!c.gapLabel && fertig,
                        kompakt, verschiebung: true };
                    })()} />
                  </Block>
                )}
                {rundeFertig ? (
                  <Block titel="Runde abgeschlossen">
                    <div className="text-center py-3">
                      <div className="text-4xl mb-1">{erg.filter(e => e === 'ok' || e === 'ok2').length >= 4 ? '🏆' : '💪'}</div>
                      <div className="text-lg font-bold">{erg.filter(e => e === 'ok' || e === 'ok2').length} von {RUNDE_LAENGE} richtig</div>
                      <button onClick={() => neueRunde(stufe)} className="knopf mt-3 px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-[13px]">
                        🔁 Neue Runde
                      </button>
                    </div>
                  </Block>
                ) : (
                  <Aufgabenkarte task={task} nr={idx + 1} gesamt={RUNDE_LAENGE} answers={ant} setAnswer={setAnswer}
                    attempt={versuch} result={res} tippAn={tippAn} setTippAn={setTippAn}
                    zeigLoesung={zeigLoesung} setZeigLoesung={setZeigLoesung} onPruefen={pruefen} onWeiter={weiter} />
                )}
              </>
            )}

            {trainTab === 'spiel' && (spiel ? (
              <>
                {spiel.phase !== 'ende' && (
                  <Block titel={`Markt für ${spiel.sc.name}`} innen="p-2">
                    <MarktChart {...(() => {
                      const g = spiel, e = g.ergebnis, neu = g.phase !== 'karte' || g.mcGeprueft;
                      const konk = neu || g.konkurrenzVorher == null ? g.konkurrenz : g.konkurrenzVorher;
                      const linien = [{ p: konk, farbe: '#EA580C', label: 'Konkurrenz', gestrichelt: true }];
                      if (g.phase !== 'karte') linien.push({ p: g.preis, farbe: '#16A34A', label: 'dein Preis' });
                      if (g.phase === 'ergebnis' && e) linien.push({ p: e.bestPreis, farbe: '#64748B', label: 'bester Preis', gestrichelt: true });
                      const menge = g.phase === 'karte' ? null : (e ? e.absatz : absatzBei(g, g.preis));
                      return { m: neu ? g.markt : g.marktVorher, compare: neu && g.marktVorher ? g.marktVorher : undefined,
                        sc: g.sc, showSurplus: false, showEq: true, linien, kompakt,
                        rechteck: g.phase === 'ergebnis' && e && e.db > 0 ? { pVon: g.stueckkosten, pBis: e.preis, q: e.absatz, label: 'Deckungsbeitrag' } : null,
                        points: menge ? [{ p: g.preis, q: menge, label: 'Absatz', color: '#16A34A', unten: true }] : null };
                    })()} />
                  </Block>
                )}
                <SpielPanel g={spiel}
                  onMC={i => spielAendern(g => { g.mcAntwort = i; })} onPruefeMC={spielPruefeMC}
                  onWeiter={() => spielAendern(g => { g.phase = 'preis'; })}
                  onPreis={v => spielAendern(g => { g.preis = v; })}
                  onSchaetzung={v => spielAendern(g => { g.schaetzung = v; })}
                  onVerkaufen={spielVerkaufen} onNaechste={spielNaechste} onNeu={() => spielStarten(null)} />
              </>
            ) : (
              <Block titel="Marktabenteuer">
                <div className="text-center py-4">
                  <div className="text-5xl mb-2">🏪</div>
                  <div className="text-lg font-bold text-slate-800">Führe dein eigenes Unternehmen</div>
                  <p className="text-[13px] text-slate-600 mt-1 leading-snug max-w-md mx-auto">
                    Über {SPIEL_RUNDEN} Runden entscheidest du jede Runde neu über deinen Verkaufspreis.
                    Ereignisse verändern Nachfrage, Kosten und den Preis deines Mitbewerbers.
                  </p>
                  {p.spielBest > 0 && <p className="text-[12px] text-amber-700 font-semibold mt-2">🏅 Rekord: {eur(p.spielBest, 0)}</p>}
                  <button onClick={() => spielStarten(null)} className="knopf mt-3 px-6 py-3 rounded-xl bg-blue-600 text-white font-bold text-sm">
                    ▶️ Partie starten
                  </button>
                </div>
              </Block>
            ))}

            {trainTab === 'theorie' && <Theorie />}
            {trainTab === 'fortschritt' && (
              <Fortschritt p={p} onName={n => setP(o => ({ ...o, name: n }))}
                onReset={() => { if (confirm('Wirklich den gesamten Fortschritt auf diesem Gerät löschen?')) setP({ ...DEFAULT_PROGRESS, stats: leerStats() }); }} />
            )}
          </div>
        )}

        {ansicht === 'einstellungen' && (
          <div className="max-w-lg mx-auto space-y-3">
            <Block titel="Einstellungen">
              <label className="block text-[12px] text-slate-600 mb-1">Dein Name (nur auf diesem Gerät gespeichert)</label>
              <input type="text" value={p.name} onChange={e => setP(o => ({ ...o, name: e.target.value }))}
                placeholder="z. B. Alex K."
                className="w-full px-2.5 py-2 rounded-lg border-2 border-slate-300 focus:border-blue-500 focus:outline-none text-sm" />
              <p className="text-[11.5px] text-slate-500 mt-2 leading-snug">
                Level, Münzen, Ergebnisse und gespeicherte Marktlagen liegen ausschließlich in diesem Browser
                (localStorage). Es werden keine Daten an einen Server gesendet.
              </p>
              <button onClick={() => { if (confirm('Wirklich alles zurücksetzen?')) { setP({ ...DEFAULT_PROGRESS, stats: leerStats() }); setAnsicht('simulator'); } }}
                className="mt-3 w-full py-2 rounded-lg border-2 border-red-300 text-red-600 font-semibold text-[13px]">
                Fortschritt zurücksetzen
              </button>
              <button onClick={() => setAnsicht('simulator')}
                className="knopf mt-2 w-full py-2 rounded-lg bg-blue-600 text-white font-bold text-[13px]">Zurück zum Simulator</button>
            </Block>
            <Block titel="Über dieses Lernspiel">
              <p className="text-[12.5px] text-slate-600 leading-relaxed">
                Marktnachfrage-Simulator für den Wirtschaftsunterricht: Angebot und Nachfrage, Marktgleichgewicht,
                Konsumenten- und Produzentenrente, Verschiebung der Kurven, staatliche Eingriffe und Preiselastizität.
                Alle Werte werden aus den hinterlegten linearen Funktionen berechnet.
              </p>
            </Block>
          </div>
        )}
      </main>

      <footer className="max-w-[1600px] mx-auto px-3 pb-6 text-center text-[11px] text-slate-400">
        Marktnachfrage-Simulator · Fortschritt wird nur lokal auf diesem Gerät gespeichert
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
