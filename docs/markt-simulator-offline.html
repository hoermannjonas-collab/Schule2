<style>
  :root{
    --paper:#FBF8F1; --card:#FFFFFF; --line:#DCE6F2; --ink:#1F2937;
    --blue:#1D4ED8; --demand:#2563EB; --supply:#EF4444; --eq:#FACC15;
  }
  html,body{background:var(--paper);}
  *{touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
  body{color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .pixel{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; letter-spacing:.06em;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px;}
  .karte{background:#FFFFFF; border:1px solid #DCE6F2; border-radius:14px;
    box-shadow:0 1px 2px rgba(15,23,42,.05);}
  /* Banderole über der Karte, mit eingekerbten Enden wie ein Wimpel */
  .banner{position:absolute; top:-13px; left:50%; transform:translateX(-50%); white-space:nowrap;
    display:flex; align-items:center; gap:7px; padding:5px 22px; color:#fff; z-index:2;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    clip-path:polygon(0 0, 100% 0, calc(100% - 11px) 50%, 100% 100%, 0 100%, 11px 50%);
    box-shadow:0 2px 0 rgba(0,0,0,.14);}
  .b-blau{background:#2563EB} .b-lila{background:#7C3AED} .b-gruen{background:#16A34A}
  .b-gelb{background:#D97706} .b-rot{background:#DC2626} .b-tuerkis{background:#0891B2}
  .banner .nr{width:15px; height:15px; border-radius:4px; background:rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; font-size:10px; letter-spacing:0;}
  /* Knöpfe mit harter Schattenkante im Pixel-Stil */
  .knopf{box-shadow:0 3px 0 rgba(0,0,0,.20); transition:transform .06s, box-shadow .06s;}
  .knopf:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.20);}
  .pixelbild{image-rendering:pixelated; image-rendering:crisp-edges; display:block;}
  .produktkarte{transition:transform .08s;}
  .produktkarte:active{transform:translateY(1px);}
  .cap{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#6B7280;}
  /* Slider im Retro-Look, gut mit dem Finger bedienbar */
  input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:22px; background:transparent;}
  input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:99px; background:#E5E7EB;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none; width:24px; height:24px; margin-top:-9px;
    border-radius:99px; background:#3B82F6; border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); cursor:pointer;}
  input[type=range]::-moz-range-track{height:6px; border-radius:99px; background:#E5E7EB;}
  input[type=range]::-moz-range-thumb{width:20px; height:20px; border:3px solid #fff; border-radius:99px; background:#3B82F6;}
  input[type=range].sup::-webkit-slider-thumb{background:#EF4444;}
  input[type=range].sup::-moz-range-thumb{background:#EF4444;}
  input[type=range].neutral::-webkit-slider-thumb{background:#F59E0B;}
  input[type=range].neutral::-moz-range-thumb{background:#F59E0B;}
  .num-input{font-variant-numeric:tabular-nums;}
  .safe-b{padding-bottom:env(safe-area-inset-bottom);}
  @keyframes pop{0%{transform:scale(.85);opacity:0} 60%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .28s ease-out}
  @keyframes drawin{from{opacity:0} to{opacity:1}}
  .drawin{animation:drawin .5s ease-out}
</style>
</head>

<script>
const {
  useState,
  useMemo,
  useEffect,
  useRef
} = React;

/* ============================================================
   1. HILFSFUNKTIONEN
   ============================================================ */
const fmt = (n, dec = 0) => !isFinite(n) ? '–' : n.toLocaleString('de-DE', {
  minimumFractionDigits: dec,
  maximumFractionDigits: dec
});
const eur = (n, dec = 2) => fmt(n, dec) + ' €';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Akzeptiert deutsche Eingaben: "1.250", "4,50", "4.5", " 1 250 Stück"
const parseNum = s => {
  if (typeof s !== 'string') return NaN;
  let t = s.trim().replace(/\s/g, '').replace(/[^0-9.,\-]/g, '');
  if (t === '' || t === '-') return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const v = parseFloat(t);
  return isNaN(v) ? NaN : v;
};

/* ============================================================
   2. MARKTMODELL   Qd = a − b·P     Qs = c + d·P
   ============================================================ */
const eqPrice = m => (m.a - m.c) / (m.b + m.d);
const qd = (m, p) => m.a - m.b * p;
const qs = (m, p) => m.c + m.d * p;
const prohibitiv = m => m.a / m.b; // Höchstzahlungsbereitschaft (Qd = 0)
const minAngebot = m => Math.max(0, -m.c / m.d); // Mindestangebotspreis (Qs = 0)

function marktKennzahlen(m) {
  const P = eqPrice(m);
  const Q = qd(m, P);
  const pMaxD = prohibitiv(m);
  const pMinS = minAngebot(m);
  const KR = 0.5 * Q * (pMaxD - P);
  // Bei c > 0 beginnt das Angebot bereits bei P = 0 -> Rente ist ein Trapez statt eines Dreiecks
  const PR = m.c <= 0 ? 0.5 * Q * (P - pMinS) : P * Q - m.d * P * P / 2;
  return {
    P,
    Q,
    pMaxD,
    pMinS,
    KR,
    PR,
    W: KR + PR
  };
}

   kd = Preisabstand vom Gleichgewicht bis zum Mindestangebotspreis
   Daraus folgen b = Q/kb und d = Q/kd → immer glatte Zahlen.

const scById = k => SCENARIOS.find(s => s.key === k) || SCENARIOS[0];
const pEinheit = sc => sc && sc.pEinheit || '€';
// Geldbeträge: große Zahlen ohne Nachkommastellen, kleine mit zwei
const geld = (n, sc) => !isFinite(n) ? '–' : fmt(n, Math.abs(n) >= 1000 ? 0 : 2) + ' ' + pEinheit(sc);
function makeMarket(sc) {
  const cand = [];
  for (const P of sc.prices) for (const Q of sc.quantities) for (const kb of sc.kb) for (const kd of sc.kd) {
    if (kd >= P) continue; // Mindestangebotspreis muss > 0 sein
    const b = Q / kb,
      d = Q / kd;
    if (!Number.isInteger(b) || !Number.isInteger(d)) continue;
    if (b < 1 || d < 1 || d > 12 * b || b > 12 * d) continue;
    cand.push({
      a: Q + b * P,
      b,
      c: Q - d * P,
      d,
      P,
      Q,
      kb,
      kd,
      sc
    });
  }
  return cand.length ? pick(cand) : {
    a: 1200,
    b: 100,
    c: -400,
    d: 100,
    P: 8,
    Q: 400,
    kb: 4,
    kd: 4,
    sc
  };
}

/* Reglerstellungen → Nachfrageverschiebung.
   Nur der Achsenabschnitt a ändert sich (Parallelverschiebung).
   Der Preis des Gutes selbst verschiebt nichts, er bewegt nur den Punkt AUF der Kurve. */
const startParameter = (sc, m) => {
  const o = {
    preis: m.P
  };
  for (const par of sc.parameter) o[par.key] = par.basis;
  return o;
};
function nachfrageFaktor(sc, werte) {
  let f = 1;
  for (const par of sc.parameter) f += par.k * ((werte[par.key] != null ? werte[par.key] : par.basis) - par.basis);
  return clamp(f, 0.4, 1.9);
}
// Untergrenze für a, damit das Gleichgewicht auch bei extremen Reglerkombinationen
// positiv bleibt: Q* = (a·d + b·c)/(b+d) ≥ 8 % der Ausgangsmenge
const aMinimum = basis => (0.08 * basis.Q * (basis.b + basis.d) - basis.b * basis.c) / basis.d;
const simulierterMarkt = (sc, basis, werte) => ({
  ...basis,
  a: Math.round(clamp(basis.a * nachfrageFaktor(sc, werte), Math.max(1, aMinimum(basis)), basis.a * 1.9))
});

/* ============================================================
   5. DIAGRAMM (SVG, reagiert auf jede Änderung)
   ============================================================ */
function niceScale(max, teile = 5) {
  if (!isFinite(max) || max <= 0) return {
    step: 1,
    max: 5
  };
  const raw = max / teile;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  return {
    step,
    max: Math.ceil(max / step) * step
  };
}

// Breite des eigenen Containers messen – maßgeblich ist die Diagrammbreite,
// nicht die Fensterbreite
function useBreite() {
  const ref = useRef(null);
  const [breite, setBreite] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    setBreite(el.getBoundingClientRect().width);
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(e => setBreite(e[0].contentRect.width));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return [ref, breite];
}
function useKompakt() {
  const [k, setK] = useState(() => typeof window !== 'undefined' && window.innerWidth < 1280);
  useEffect(() => {
    const h = () => setK(window.innerWidth < 1280);
    window.addEventListener('resize', h);
    return () => window.removeEventListener('resize', h);
  }, []);
  return k;
}
